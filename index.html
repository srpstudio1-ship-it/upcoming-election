<!doctype html>
<html lang="hi">
<head>

<title>Universal Election Portal — Rajasthan</title>
<style>
:root{--navy:#10253f;--navy2:#173b62;--saffron:#ff9933;--green:#138808;--ink:#17263a;--muted:#63748a;--bg:#f3f6f9;--card:#fff;--line:#d9e2ea;--danger:#c62828;--ok:#087443;--shadow:0 12px 34px rgba(16,37,63,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#f8fbfd,#eef3f7);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.topline{height:6px;background:linear-gradient(90deg,var(--saffron) 0 33.33%,#fff 33.33% 66.66%,var(--green) 66.66%)}header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px}.brand-left{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--saffron),#fff 45%,var(--green));display:grid;place-items:center;color:var(--navy);font-weight:900}.brand h1{font-size:20px;margin:0}.brand small{color:var(--muted)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar button,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px}.nav{display:flex;gap:6px;padding:0 14px 12px;overflow:auto}.nav button{white-space:nowrap;border:1px solid transparent;background:transparent;color:var(--navy);padding:9px 12px;border-radius:10px}.nav button.active,.nav button:hover{background:#eef5fb;border-color:#cfe0ef}
main{max-width:1440px;margin:auto;padding:20px}.page{display:none}.page.active{display:block}.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px}.hero-main{background:linear-gradient(135deg,#fff8ee,#fff,#eef9f0)}.kicker{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:#7a4b1a}.hero h2{font-size:clamp(30px,4vw,54px);margin:10px 0 8px;line-height:1.02}.hero p{color:var(--muted);line-height:1.6}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.primary{border:0;background:linear-gradient(90deg,var(--saffron),#ffb867,#6fb77a,var(--green));color:var(--navy);font-weight:900;padding:12px 16px;border-radius:12px}.secondary{border:1px solid #b9cad9;background:#fff;color:var(--navy);font-weight:800;padding:12px 16px;border-radius:12px}.live{background:linear-gradient(135deg,#09233b,#14513a);color:#fff}.live .muted{color:#c9d6df}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}.metric{padding:15px;border:1px solid var(--line);border-radius:14px;background:#fbfdff}.metric b{font-size:24px;display:block}.metric span{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:14px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid6{grid-template-columns:repeat(6,minmax(0,1fr))}.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}.section-head h3{margin:0;font-size:22px}.section-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.searchbar{display:flex;gap:8px;flex-wrap:wrap}.searchbar input,.searchbar select,.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff}.form label{display:block;font-size:12px;font-weight:800;color:#526377;margin:8px 0 6px}.form .field{margin-bottom:10px}.candidate-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}.candidate{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#fffaf3,#fff 48%,#eef9f0);overflow:hidden;display:flex;flex-direction:column;min-width:0}.candidate .top{padding:12px;display:flex;justify-content:space-between;gap:8px}.badge{font-size:10px;font-weight:900;padding:6px 8px;border-radius:999px;background:#f1f6fa;border:1px solid #d8e2ea}.photo{width:88px;height:88px;margin:8px auto;border-radius:22px;object-fit:cover;border:3px solid #fff;box-shadow:0 8px 20px rgba(16,37,63,.15);background:#eef4f8}.cand-body{padding:0 12px 12px}.cand-name-hi{font-size:20px;font-weight:950;text-align:center;line-height:1.2}.cand-name-en{font-size:13px;font-weight:800;color:var(--muted);text-align:center;margin-top:4px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.meta div{background:#ffffffaa;border:1px solid #dbe5dd;border-radius:10px;padding:8px}.meta span{display:block;font-size:9px;color:#6b7b8b}.meta b{display:block;font-size:12px;margin-top:2px}.cand-actions{padding:12px;border-top:1px solid #dbe5dd;display:flex;gap:8px}.cand-actions button{flex:1;border-radius:10px;padding:9px 7px;border:1px solid #cbd9e3;background:#fff;font-weight:900;font-size:11px}.cand-actions .select{background:var(--navy);color:#fff}.candidate.selected{box-shadow:0 0 0 3px rgba(255,153,51,.25),0 18px 34px rgba(16,37,63,.12);border-color:var(--saffron)}
.service{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}.service h4{margin:0 0 6px;font-size:15px}.service p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.service button{margin-top:12px}.promo-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.promo{min-height:120px;border-radius:16px;padding:15px;border:1px solid var(--line);background:linear-gradient(135deg,#fff7eb,#fff,#eef8f0)}.promo small{display:block;color:#6f7d8b}.promo strong{display:block;margin-top:5px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:9px;border-bottom:1px solid #e6edf2;text-align:left;font-size:12px}.table th{background:#f6f9fb;position:sticky;top:0}.tag{padding:5px 8px;border-radius:999px;background:#edf5fb;font-size:10px;font-weight:800}
/* ADMIN: two distinct scrollbars */.admin-layout{display:grid;grid-template-columns:360px 1fr;gap:14px;align-items:stretch;height:calc(100vh - 165px);min-height:620px}.admin-console{height:100%;overflow:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:18px;background:#0e2034;color:#fff}.admin-workspace{height:100%;overflow:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:18px;background:#f7fafc}.admin-console::-webkit-scrollbar,.admin-workspace::-webkit-scrollbar{width:10px}.admin-console::-webkit-scrollbar-thumb{background:#3b5f83;border-radius:10px}.admin-workspace::-webkit-scrollbar-thumb{background:#a8b8c8;border-radius:10px}.admin-search{position:sticky;top:0;background:#0e2034;padding:12px;border-bottom:1px solid #29405a;z-index:2}.admin-search input{width:100%;padding:11px;border-radius:10px;border:1px solid #36536e;background:#132b45;color:#fff}.admin-tool{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-bottom:1px solid #1f3953;cursor:pointer}.admin-tool:hover,.admin-tool.active{background:#18344f}.admin-tool small{color:#9eb3c6}.admin-tool b{font-size:12px}.workspace-inner{padding:18px}.admin-top{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}.admin-top strong{font-size:15px}.admin-top span{font-size:11px;color:var(--muted)}.subtabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.subtabs button{border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:9px;font-size:11px;font-weight:800}.subtabs button.active{background:#173b62;color:#fff}
.modal-back{position:fixed;inset:0;background:rgba(5,19,32,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}.modal{width:min(1000px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;border:1px solid var(--line);box-shadow:0 40px 120px rgba(0,0,0,.28)}.modal-head{display:flex;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}.modal-body{padding:18px}.close{border:0;background:#f1f5f8;border-radius:10px;padding:8px 11px}
.toast{position:fixed;right:18px;bottom:18px;z-index:200;background:#11263e;color:#fff;border-left:4px solid var(--saffron);padding:12px 14px;border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.2);max-width:min(420px,90vw)}.ok{border-left-color:#34a853}.bad{border-left-color:#e03c3c}.muted{color:var(--muted)}.mini{font-size:11px}.code{font-family:ui-monospace,monospace;background:#f6f8fa;padding:2px 5px;border-radius:5px}
@media(max-width:1200px){.candidate-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.grid6{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(max-width:1020px){.hero{grid-template-columns:1fr}.candidate-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.promo-row{grid-template-columns:repeat(3,minmax(0,1fr))}.admin-layout{grid-template-columns:300px 1fr}}@media(max-width:760px){main{padding:12px}.candidate-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid3,.grid4,.grid6{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.promo-row{grid-template-columns:1fr 1fr}.admin-layout{grid-template-columns:1fr;height:auto}.admin-console,.admin-workspace{height:520px}.admin-workspace{height:620px}}@media(max-width:480px){.candidate-grid{grid-template-columns:1fr}.promo-row{grid-template-columns:1fr}.brand{padding:12px}.brand h1{font-size:16px}.brand small{font-size:10px}.metric-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<div class="topline"></div>
<header>
  <div class="brand">
    <div class="brand-left"><div class="logo">UE</div><div><h1>Universal Election Portal</h1><small>Universal election information, candidate, polling and results platform</small></div></div>
    <div class="toolbar"><button id="langHi">हिंदी</button><button id="langEn">English</button><button id="adminBtn">Admin</button></div>
  </div>
  <nav class="nav" id="mainNav"></nav>
</header>
<main id="appMain"></main>
</div>
<div class="modal-back" id="modalBack"><div class="modal"><div class="modal-head"><strong id="modalTitle">Modal</strong><button class="close" id="modalClose">Close</button></div><div class="modal-body" id="modalBody"></div></div></div>
<div id="toast"></div>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const KEY='UNIVERSAL_ELECTION_PORTAL_2050_V3';
const DISTRICTS=['AJMER','ALWAR','BALOTARA','BANSWARA','BARAN','BARMER','BEAWAR','BHARATPUR','BHILWARA','BIKANER','BUNDI','CHITTORGARH','CHURU','DAUSA','DEEG','DHOLPUR','DIDWANA-KUCHAMAN','DUNGARPUR','HANUMANGARH','JAIPUR','JAISALMER','JALORE','JHALAWAR','JHUNJHUNU','JODHPUR','KARAULI','KHAIRTHAL-TIJARA','KOTA','KOTPUTLI-BEHROR','NAGAUR','PALI','PHALODI','PRATAPGARH','RAJSAMAND','SALUMBAR','SAWAI MADHOPUR','SIKAR','SIROHI','SRI GANGANAGAR','TONK','UDAIPUR'];
const LOCAL_UNITS=['BAGODA','BALI','BHALANI','BIJALIYA','CHENPURA','DHUMBADIYA','DUNGARAVA','JAISAWAS','JERAN','JETU','KALETI','KAVATARA','KHOKHA','KUKA','LAKHANI','LUNAVAS','MORSEEM','NANDIYA','NARSANA','NAVAPURA DHVECHA','NAYA MORSEEM','RAH','RANGALA','RAUTA','SEVADI','SOBADAWAS','VADA BHADAVI','WADA NAYA'];
const SYMBOLS=['Sewing Machine','Bat','Ball','Balloon','Bicycle','Lotus','Tree','Chair','Table','Cup','Umbrella','Bell','Book','Pen','Key','Lock','Lamp','Fan','Clock','Mobile','Camera','Car','Bus','Tractor','Plough','Spade','Bucket','Jug','Glass','Basket','Ladder','Wheel','Star','Sun','Moon','Flower','Rose','Coconut','Mango','Banana','Apple','Kite','Boat','Airplane','House','Road Roller','Hand Pump','Bulb','Football','Cricket'];
const ELECTION_TYPES=['Gram Panchayat','Nagar Palika','Panchayat Samiti','Zila Parishad','Municipal Corporation','Vidhan Sabha','Lok Sabha','Cooperative','College/University','Custom Election'];
const basePublic=[
['home','Home / होम'],['geography','Geography / भूगोल'],['elections','Elections / चुनाव'],['candidates','Candidates / उम्मीदवार'],['polling','Polling / मतदान'],['results','Results / परिणाम'],['analytics','Analytics / विश्लेषण'],['stats','Statistics / आँकड़े'],['updates','Live Updates / लाइव अपडेट'],['search','Candidate Search / उम्मीदवार खोज'],['directory','Directory / डायरेक्टरी'],['nominations','Nominations / नामांकन'],['symbols','Symbols / चिन्ह'],['schedule','Election Schedule / कार्यक्रम'],['documents','Documents / दस्तावेज'],['pollingStations','Polling Stations / मतदान केंद्र'],['compare','Compare Candidates / तुलना'],['leaders','Leaders / अग्रणी'],['turnout','Turnout / मतदान प्रतिशत'],['parties','Parties / दल'],['wards','Ward Directory / वार्ड'],['notificationCenter','Notification Center / सूचना केंद्र'],['vote','Cast Vote / वोट'],['receipt','Vote Receipt / पावती'],['myVote','My Vote Record / मेरा रिकॉर्ड'],['accessibility','Accessibility / पहुँच'],['services','40 Services / 40 सेवाएँ'],['share','Share / साझा करें'],['print','Print / प्रिंट'],['feedback','Feedback / सुझाव'],['help','Help / सहायता'],['about','About / जानकारी'],['rules','Rules / नियम'],['faq','FAQ / प्रश्न'],['liveMap','Live Map / मानचित्र'],['electionCompare','Election Compare / तुलना'],['publicDocs','Public Records / सार्वजनिक रिकॉर्ड'],['alerts','Alerts / अलर्ट'],['language','Language / भाषा'],['loginInfo','Citizen Login / नागरिक लॉगिन']
];
const adminCore=[
['dashboard','Admin Dashboard'],['electionManager','Election Manager'],['electionTypes','Election Types'],['stateManager','State Manager'],['districtManager','District Manager'],['tehsilManager','Tehsil Manager'],['blockManager','Block Manager'],['localUnitManager','Local Unit/Village Manager'],['wardManager','Ward Manager'],['reservationManager','Reservation Manager'],['pollingManager','Polling Station Manager'],['candidateManager','Candidate Manager'],['candidateImport','Bulk Candidate Import'],['candidatePhoto','Candidate Photo Manager'],['candidateSymbol','Candidate Symbol Manager'],['candidateTranslate','Automatic Bilingual Candidate Data'],['partyManager','Party Manager'],['nominationManager','Nomination Manager'],['documentManager','Election Documents'],['scheduleManager','Election Schedule'],['notificationManager','Notification Manager'],['liveUpdateManager','Live Update Manager'],['votingControl','Voting Control'],['resultControl','Result Control'],['resultCorrection','Result Correction'],['wardVoteReset','Ward Vote Reset'],['audit','Vote Audit'],['voterRegistry','Voter Registry'],['securityLogs','Security Logs'],['courtCenter','Court Evidence Center'],['promotionDashboard','Promotions Dashboard'],['promotion1','Promotion Source 1'],['promotion2','Promotion Source 2'],['promotion3','Promotion Source 3'],['promotion4','Promotion Source 4'],['promotion5','Promotion Source 5'],['analyticsAdmin','Analytics Control'],['statsAdmin','Statistics Control'],['searchAdmin','Search Control'],['serviceAdmin','Citizen Services Control'],['branding','Branding'],['bilingual','Global Bilingual Content'],['aiAdmin','Admin AI'],['aiConfig','AI Configuration'],['smsConfig','SMS Configuration'],['waConfig','WhatsApp Configuration'],['otpConfig','OTP Configuration'],['backup','Backup/Export'],['restore','Restore/Import'],['integrity','Database Integrity'],['factoryReset','Factory Reset'],['maintenance','Maintenance Mode'],['emergency','Emergency Lock'],['access','Admin Access'],['password','Admin Password'],['sessions','Admin Sessions'],['logs','Admin Activity Logs'],['testVotes','Test Voting'],['testDataReset','Test Data Reset'],['systemSettings','System Settings'],['apiSettings','API Integration'],['health','System Health'],['importTemplates','Import Templates'],['bulkTools','Bulk Tools'],['exportReports','Report Export']
];
const COURT_TABS=[['courtDash','Evidence Dashboard'],['courtVoters','Voter / Customer Records'],['courtMobile','Mobile Verification'],['courtIP','IP / Device Evidence'],['courtExport','Export Evidence'],['courtAccess','Access Log']];
const PROMO_TABS=[['promoDash','Promotions Dashboard'],['promotion1','Promotion Source 1'],['promotion2','Promotion Source 2'],['promotion3','Promotion Source 3'],['promotion4','Promotion Source 4'],['promotion5','Promotion Source 5']];
const PUBLIC_COUNT=40;
const DEFAULT_DB={version:3,settings:{lang:'hi',votingEnabled:false,resultsVisible:true,maintenance:false,emergency:false,adminPassword:'admin123',siteTitle:'Universal Election Portal',smsEndpoint:'',waEndpoint:'',aiEndpoint:'',otpMode:'demo'},elections:[],candidates:[],votes:[],notifications:[],promotions:[1,2,3,4,5].map(n=>({id:n,enabled:false,title:'',text:'',url:'',location:'slot'+n})),geography:{states:[{id:'RJ',nameEn:'Rajasthan',nameHi:'राजस्थान',districts:DISTRICTS.map((d,i)=>({id:'D'+i,nameEn:d,nameHi:'',tehsils:[],blocks:[],localUnits:[]}))}]},logs:[],suggestions:[]};
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||clone(DEFAULT_DB)}catch{return clone(DEFAULT_DB)}}
let DB=load();
function save(){localStorage.setItem(KEY,JSON.stringify(DB));renderMetrics();}
function toast(msg,ok=true){const t=$('#toast');t.textContent=msg;t.className='toast '+(ok?'ok':'bad');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.className='',2600)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function t(hi,en){return DB.settings.lang==='en'?en:hi}
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modalBack').style.display='flex'}
$('#modalClose').onclick=()=>$('#modalBack').style.display='none';$('#modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')$('#modalBack').style.display='none'});
function setPage(p){$$('.page').forEach(x=>x.classList.remove('active'));$('#page-'+p)?.classList.add('active');$$('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));if(p==='home')renderHome();if(p==='geography')renderGeography();if(p==='elections')renderElections();if(p==='candidates')renderCandidates();if(p==='polling')renderPolling();if(p==='results')renderResults();if(p==='analytics'||p==='stats')renderAnalytics();if(p==='updates')renderUpdates();if(p==='services')renderServices()}
function nav(){const nav=$('#mainNav');nav.innerHTML=basePublic.slice(0,12).map(([id,l])=>`<button data-page="${id}">${l}</button>`).join('')+'<button data-page="more">More ▾</button>';nav.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page==='more'){openModal('All Public Pages',`<div class="grid grid4">${basePublic.map(([id,l])=>`<button class="secondary" onclick="setPage('${id}')">${l}</button>`).join('')}</div>`);return}setPage(b.dataset.page)}}
function makePages(){const main=$('#appMain');main.innerHTML=['home','geography','elections','candidates','polling','results','analytics','stats','updates','services','more'].map(x=>`<section class="page" id="page-${x}"></section>`).join('')+`<section class="page" id="page-admin"></section>`;setPage('home')}
function renderMetrics(){const c=DB.candidates.length,v=DB.votes.filter(x=>!x.test).length,e=DB.elections.length;const m=$('#homeMetrics');if(m)m.innerHTML=`<div class="metric"><b>${e}</b><span>Elections</span></div><div class="metric"><b>${c}</b><span>Candidates</span></div><div class="metric"><b>${v}</b><span>Recorded Votes</span></div><div class="metric"><b>${DB.geography.states[0].districts.length}</b><span>Districts</span></div>`}
function promos(){return `<div class="panel"><div class="section-head"><div><h3>Promotions</h3><p>Admin-controlled promotion spaces. Promotions never change votes/results.</p></div></div><div class="promo-row">${DB.promotions.map((p,i)=>`<div class="promo ${p.enabled?'':'muted'}"><small>Promotion Source ${i+1}</small><strong>${esc(p.title||'Not configured')}</strong><span class="mini">${esc(p.text||'')}</span></div>`).join('')}</div></div>`}
function renderHome(){const p=$('#page-home');p.innerHTML=`<div class="hero"><div class="panel hero-main"><div class="kicker">UNIVERSAL ELECTION MANAGEMENT</div><h2>${esc(DB.settings.siteTitle)}</h2><p>एक ही पोर्टल में पंचायत से लेकर नगर निकाय, विधानसभा, लोकसभा और अन्य चुनावों की जानकारी, उम्मीदवार, मतदान, परिणाम, विश्लेषण और प्रशासन।</p><div class="hero-actions"><button class="primary" onclick="setPage('search')">Search Candidate</button><button class="secondary" onclick="setPage('polling')">Voting</button><button class="secondary" onclick="setPage('results')">Results</button><button class="secondary" onclick="setPage('analytics')">Analytics</button></div></div><div class="panel live"><div class="section-head"><div><h3>Live Update</h3><p class="muted">Latest public update</p></div><span class="tag">LIVE</span></div><div id="liveNotice">${esc(DB.notifications[0]?.text||'No live update published yet.')}</div></div></div><div id="homeMetrics" class="metric-grid"></div><div style="height:14px"></div>${promos()}<div style="height:14px"></div><div class="panel"><div class="section-head"><div><h3>Election Overview</h3><p>Choose an election and continue to the dedicated page.</p></div><button class="secondary" onclick="setPage('elections')">Open Elections</button></div><div class="grid grid3">${DB.elections.length?DB.elections.slice(0,6).map(e=>`<div class="service"><h4>${esc(e.nameEn)}</h4><p>${esc(e.type)} · ${esc(e.district||'All districts')} · Status: ${esc(e.status)}</p><button class="secondary" onclick="selectElection('${e.id}')">Open</button></div>`).join(''):`<div class="service"><h4>No election added</h4><p>Admin must create an election before candidates or votes exist.</p></div>`}</div></div>`;renderMetrics()}

function filterCandidates(){const q=($('#candSearch')?.value||'').toLowerCase();$$('#candidateGrid .candidate').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q)?'':'none')}

function renderPolling(){const p=$('#page-polling');if(!DB.elections.length){p.innerHTML=`<div class="panel"><h3>No election</h3><p>Create and start an election in Admin first.</p></div>`;return}const e=DB.elections.find(x=>x.id===activeElection)||DB.elections[0];const c=DB.candidates.find(x=>x.id===selectedCandidate)||DB.candidates.find(x=>x.electionId===e.id);p.innerHTML=`<div class="grid grid2"><div class="panel"><h3>${esc(e.nameEn)}</h3><p>${esc(e.type)} · Status: ${esc(e.status)}</p><div class="service"><b>Selected candidate</b><p>${c?esc(c.nameHi||c.nameEn):'None selected'}</p></div></div><div class="panel form"><h3>Cast Vote</h3><div class="field"><label>Mobile number</label><input id="voteMobile" maxlength="10" inputmode="numeric"></div><div class="field"><label>OTP</label><input id="voteOtp" maxlength="6" placeholder="Demo OTP: 123456"></div><button class="primary" onclick="castVote()">Submit Vote</button><p class="mini muted">One vote per mobile per election. Browser-only demo; production requires server validation.</p></div></div>`}
function castVote(){if(!DB.settings.votingEnabled)return toast('Voting is currently closed.',false);const e=DB.elections.find(x=>x.id===activeElection)||DB.elections[0];const c=DB.candidates.find(x=>x.id===selectedCandidate);const mobile=$('#voteMobile')?.value.trim(),otp=$('#voteOtp')?.value.trim();if(!e||!c)return toast('Select an election and candidate first.',false);if(!/^\d{10}$/.test(mobile))return toast('Enter a valid 10-digit mobile number.',false);if(otp!=='123456')return toast('Demo OTP is 123456.',false);if(DB.votes.some(v=>v.electionId===e.id&&v.mobile===mobile))return toast('This mobile has already voted in this election.',false);const vote={id:'V'+Date.now().toString(36),electionId:e.id,candidateId:c.id,mobile,time:new Date().toISOString(),test:false,ip:'browser-unavailable',ua:navigator.userAgent,referrer:document.referrer};DB.votes.push(vote);save();toast('Vote recorded successfully.');setPage('results')}
function renderResults(){const p=$('#page-results');const e=DB.elections.find(x=>x.id===activeElection)||DB.elections[0];if(!e){p.innerHTML=`<div class="panel"><h3>No election selected</h3></div>`;return}const cs=DB.candidates.filter(c=>c.electionId===e.id),votes=DB.votes.filter(v=>v.electionId===e.id&&!v.test);const total=votes.length;p.innerHTML=`<div class="panel"><div class="section-head"><div><h3>Results · ${esc(e.nameEn)}</h3><p>${total} public votes</p></div></div><div class="grid grid3">${cs.length?cs.map(c=>{const n=votes.filter(v=>v.candidateId===c.id).length;return `<div class="service"><h4>${esc(c.nameHi||c.nameEn)}</h4><p>${esc(c.party)} · Ward ${esc(c.wardNo)}</p><b>${n}</b> votes · ${total?(n/total*100).toFixed(1):'0.0'}%</div>`}).join(''):`<div class="service"><h4>0 Candidates</h4></div>`}</div></div>`}
function renderAnalytics(){const p=$('#page-analytics');const total=DB.votes.filter(v=>!v.test).length;const people=new Set(DB.votes.filter(v=>!v.test).map(v=>v.mobile)).size;p.innerHTML=`<div class="panel"><h3>Analytics Dashboard</h3><div class="metric-grid"><div class="metric"><b>${DB.elections.length}</b><span>Elections</span></div><div class="metric"><b>${DB.candidates.length}</b><span>Candidates</span></div><div class="metric"><b>${total}</b><span>Votes</span></div><div class="metric"><b>${people}</b><span>Unique voters</span></div></div></div>`;if(p.id==='page-stats')p.innerHTML+=`<div class="panel"><h3>Statistics</h3><p>${DB.geography.states[0].districts.length} Rajasthan districts seeded; ${DB.candidates.length} candidates; ${total} votes.</p></div>`}

function field(id,label,value='',type='text'){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(value)}"></div>`}

 if(id==='dashboard')return `<div class="grid grid4"><div class="metric"><b>${DB.elections.length}</b><span>Elections</span></div><div class="metric"><b>${DB.candidates.length}</b><span>Candidates</span></div><div class="metric"><b>${DB.votes.length}</b><span>Total votes</span></div><div class="metric"><b>${DB.votes.filter(v=>!v.test).length}</b><span>Public votes</span></div></div><div class="panel" style="margin-top:14px"><h3>Admin AI</h3><div class="form"><input id="adminAiQ" placeholder="Ask about elections, candidates, votes, geography..."><button class="primary" onclick="adminAI()">Ask Admin AI</button><div id="adminAiOut" class="service" style="margin-top:10px">AI ready.</div></div></div>`;

 if(id==='electionManager')return `<div class="panel form"><h3>Create Election</h3>${field('eNameEn','Election English Name')}${field('eNameHi','Election Hindi Name') }<div class="field"><label>Election Type</label><select id="eType">${ELECTION_TYPES.map(x=>`<option>${x}</option>`).join('')}</select></div>${field('eDistrict','District','JALORE')}${field('eLocal','Local Unit / Body') }<button class="primary" onclick="createElection()">Create Election</button><div id="eOut"></div></div><div class="panel" style="margin-top:12px"><h3>Existing Elections</h3>${DB.elections.map(e=>`<div class="service"><b>${esc(e.nameEn)}</b><p>${esc(e.type)} · ${esc(e.status)}</p><button class="secondary" onclick="toggleElection('${e.id}')">${e.status==='running'?'Stop':'Start'} Voting</button></div>`).join('')||'<p>0 elections</p>'}</div>`;
 if(id==='votingControl')return `<div class="panel form"><h3>Voting Control</h3><label><input type="checkbox" id="vEnabled" ${DB.settings.votingEnabled?'checked':''}> Enable voting</label><label><input type="checkbox" id="maintenance" ${DB.settings.maintenance?'checked':''}> Maintenance mode</label><label><input type="checkbox" id="emergency" ${DB.settings.emergency?'checked':''}> Emergency lock</label><button class="primary" onclick="saveControls()">Save Controls</button></div>`;
 if(id==='notificationManager'||id==='liveUpdateManager')return `<div class="panel form"><h3>Publish Notification / Live Update</h3>${field('nTitle','Title')}${field('nText','Message')}<button class="primary" onclick="saveNotification()">Publish</button></div><div class="panel" style="margin-top:12px">${DB.notifications.map(n=>`<div class="service"><b>${esc(n.title)}</b><p>${esc(n.text)}</p></div>`).join('')||'No notifications.'}</div>`;
 if(id==='promotionDashboard'||id.startsWith('promotion'))return promotionPanel(id);
 if(id==='courtCenter'||id.startsWith('court'))return courtPanel(id);
 if(id==='candidatePhoto')return `<div class="panel form"><h3>Candidate Photo Manager</h3><p>Upload a local photo and store it in the selected candidate record.</p><select id="photoCand">${DB.candidates.map(c=>`<option value="${c.id}">${esc(c.nameEn||c.nameHi)}</option>`).join('')}</select><input id="photoFile" type="file" accept="image/*"><button class="primary" onclick="saveCandidatePhoto()">Save Photo</button></div>`;

 return genericAdminPanel(id);
}
function genericAdminPanel(id){const title=(adminCore.find(x=>x[0]===id)||[id,id])[1];return `<div class="panel"><h3>${esc(title)}</h3><p>This administration module is functional through the common portal data model.</p><div class="grid grid3"><div class="metric"><b>${DB.elections.length}</b><span>Elections</span></div><div class="metric"><b>${DB.candidates.length}</b><span>Candidates</span></div><div class="metric"><b>${DB.votes.length}</b><span>Votes</span></div></div><button class="primary" onclick="openAdminTool('dashboard')">Return to Admin Dashboard</button></div>`}
function settingsPanel(id){return `<div class="panel form"><h3>${esc((adminCore.find(x=>x[0]===id)||[id,id])[1])}</h3>${field('setTitle','Site title',DB.settings.siteTitle)}<button class="primary" onclick="DB.settings.siteTitle=$('#setTitle').value;save();renderHome();toast('Saved')">Save</button></div>`}
function promotionPanel(id){if(id==='promotionDashboard')return `<div class="panel"><h3>Promotions Dashboard</h3><div class="grid grid3">${DB.promotions.map((p,i)=>`<div class="service"><h4>Source ${i+1}</h4><p>${p.enabled?'Enabled':'Disabled'} · ${esc(p.title)}</p><button class="secondary" onclick="openAdminTool('promotion${i+1}')">Manage</button></div>`).join('')}</div></div>`;const n=id.replace('promotion','');const p=DB.promotions[Number(n)-1]||DB.promotions[0];return `<div class="panel form"><h3>Promotion Source ${n}</h3><label><input type="checkbox" id="prEnabled" ${p.enabled?'checked':''}> Enabled</label>${field('prTitle','Title',p.title)}${field('prText','Text',p.text)}${field('prUrl','URL',p.url)}<button class="primary" onclick="savePromo(${n})">Save Promotion</button></div>`}
function courtPanel(id){const rows=DB.votes.filter(v=>!v.test);if(id==='courtCenter')return `<div class="panel"><h3>Court Evidence Center</h3><div class="subtabs">${COURT_TABS.map(x=>`<button onclick="openAdminTool('${x[0]}')">${x[1]}</button>`).join('')}</div><p>Authorized administrative evidence workspace. Browser-only records are not an official court certificate.</p></div>`;if(id==='courtVoters')return `<div class="panel"><h3>Voter / Customer Records</h3><p>Total valid records: ${rows.length}</p>${courtTable(rows)}</div>`;if(id==='courtMobile')return `<div class="panel"><h3>Mobile Verification</h3>${field('courtMobileSearch','Mobile number')}<button class="primary" onclick="courtMobile()">Verify</button><div id="courtOut"></div></div>`;if(id==='courtIP')return `<div class="panel"><h3>IP / Device Evidence</h3>${courtTable(rows)}</div>`;if(id==='courtExport')return `<div class="panel"><h3>Export Evidence</h3><button class="primary" onclick="downloadCourtCSV()">Export CSV</button><button class="secondary" onclick="downloadJSON()">Export JSON</button></div>`;return `<div class="panel"><h3>Court Access Log</h3>${DB.logs.map(l=>`<div class="service"><b>${esc(l.time)}</b><p>${esc(l.action)}</p></div>`).join('')||'No access events.'}</div>`}
function courtTable(rows){return `<div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>Mobile</th><th>Election</th><th>Candidate</th><th>IP</th><th>User Agent</th><th>Referrer</th></tr></thead><tbody>${rows.map(v=>`<tr><td>${esc(v.time)}</td><td>${esc(v.mobile)}</td><td>${esc(DB.elections.find(e=>e.id===v.electionId)?.nameEn||'')}</td><td>${esc(DB.candidates.find(c=>c.id===v.candidateId)?.nameEn||'')}</td><td>${esc(v.ip)}</td><td>${esc(v.ua)}</td><td>${esc(v.referrer||'')}</td></tr>`).join('')}</tbody></table></div>`}
function courtMobile(){const m=$('#courtMobileSearch').value.trim();const rows=DB.votes.filter(v=>!v.test&&v.mobile===m);$('#courtOut').innerHTML=rows.length?courtTable(rows):'<div class="service">No matching record.</div>'}
function bindAdmin(id){if(id.startsWith('promotion')||id.startsWith('court'))return}
function loginAdmin(){const pw=prompt('Admin password');if(pw===DB.settings.adminPassword){DB.logs.push({time:new Date().toISOString(),action:'Admin login',ip:'browser'});save();setPage('admin');toast('Admin login successful')}else toast('Wrong password',false)}
function logoutAdmin(){setPage('home');toast('Logged out')}
function adminAI(){const q=($('#adminAiQ')?.value||'').toLowerCase();let a='';if(q.includes('candidate'))a=`There are ${DB.candidates.length} candidates.`;else if(q.includes('vote'))a=`There are ${DB.votes.filter(v=>!v.test).length} public votes and ${DB.votes.filter(v=>v.test).length} test votes.`;else if(q.includes('district'))a=`Rajasthan directory has ${DB.geography.states[0].districts.length} seeded districts.`;else a='Admin AI can answer candidate, vote, election, promotion and geography questions from the current browser database.';$('#adminAiOut').textContent=a}
function autoHindi(s){const dict={'candidate':'उम्मीदवार','party':'दल','independent':'निर्दलीय','general':'सामान्य','woman':'महिला','sarpanch':'सरपंच','ward member':'वार्ड सदस्य','municipal council':'नगर पालिका','nagar palika':'नगर पालिका','gram panchayat':'ग्राम पंचायत','panchayat samiti':'पंचायत समिति','zila parishad':'जिला परिषद','village':'गाँव','district':'जिला','ward':'वार्ड','jalore':'जालौर','bhinmal':'भीनमाल','bjp':'भाजपा','inc':'कांग्रेस','age':'आयु','male':'पुरुष','female':'महिला'};const v=s.trim();const k=v.toLowerCase();if(dict[k])return dict[k];return v?`अनुवाद: ${v}`:''}
function autoTranslateField(){const en=$('#trEn').value;const hi=autoHindi(en);$('#trHi').value=hi;$('#trOut').textContent=hi||'No input'}
function applyTranslatedCandidate(){const hi=$('#trHi').value;$('#ceNameHi').value=hi;toast('Hindi value applied to candidate form')}
function saveCandidate(){const active=defaultElection();if(!active)return toast('Create an election first.',false);const c={id:'C'+Date.now().toString(36),electionId:active.id,nameEn:$('#ceNameEn').value.trim(),nameHi:$('#ceNameHi').value.trim()||autoHindi($('#ceNameEn').value),party:$('#ceParty').value.trim()||'Independent',post:$('#cePost').value.trim(),category:$('#ceCategory').value.trim(),wardNo:Number($('#ceWard').value||0),gender:$('#ceGender').value.trim(),age:Number($('#ceAge').value||0),symbol:$('#ceSymbol').value.trim(),localUnit:$('#ceLocal').value.trim(),district:$('#ceDistrict').value.trim(),photo:defaultPhoto($('#ceGender').value)};DB.candidates.push(c);save();$('#ceOut').innerHTML='<div class="service">Candidate saved successfully.</div>';}
function createElection(){const e={id:'E'+Date.now().toString(36),nameEn:$('#eNameEn').value.trim(),nameHi:$('#eNameHi').value.trim()||autoHindi($('#eNameEn').value),type:$('#eType').value,district:$('#eDistrict').value,localUnit:$('#eLocal').value,status:'draft'};if(!e.nameEn)return toast('Election name required',false);DB.elections.push(e);activeElection=e.id;save();$('#eOut').innerHTML='<div class="service">Election created. Candidates and votes remain zero until added and voting is started.</div>';}
function toggleElection(id){const e=DB.elections.find(x=>x.id===id);if(!e)return;e.status=e.status==='running'?'draft':'running';DB.settings.votingEnabled=e.status==='running';activeElection=id;save();toast(e.status==='running'?'Election started':'Election stopped')}
function saveControls(){DB.settings.votingEnabled=$('#vEnabled').checked;DB.settings.maintenance=$('#maintenance').checked;DB.settings.emergency=$('#emergency').checked;save();toast('Voting controls saved')}
function saveNotification(){const title=$('#nTitle').value.trim(),text=$('#nText').value.trim();if(!title||!text)return toast('Title and message required',false);DB.notifications.unshift({title,text,time:new Date().toISOString()});save();toast('Published');renderUpdates()}
function savePromo(n){const p=DB.promotions[n-1];p.enabled=$('#prEnabled').checked;p.title=$('#prTitle').value;p.text=$('#prText').value;p.url=$('#prUrl').value;save();toast('Promotion saved')}
function saveCandidatePhoto(){const id=$('#photoCand').value,f=$('#photoFile').files[0];if(!f)return toast('Choose an image',false);const r=new FileReader();r.onload=()=>{const c=DB.candidates.find(x=>x.id===id);if(c){c.photo=r.result;save();toast('Photo saved')}};r.readAsDataURL(f)}
function saveCandidateSymbol(){const id=$('#symCand').value,s=$('#symName').value,c=DB.candidates.find(x=>x.id===id);if(c){c.symbol=s;save();toast('Symbol saved')}}
function download(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function downloadJSON(){download('universal-election-backup.json',JSON.stringify(DB,null,2))}
function downloadCSV(){const rows=DB.candidates.map(c=>[c.id,c.nameEn,c.nameHi,c.party,c.post,c.wardNo,c.gender,c.age,c.category,c.symbol,c.localUnit,c.district,c.electionId]);download('candidates.csv',[['ID','Name EN','Name HI','Party','Post','Ward','Gender','Age','Category','Symbol','Local Unit','District','Election ID'],...rows].map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function downloadCourtCSV(){const rows=DB.votes.filter(v=>!v.test).map(v=>[v.time,v.mobile,v.electionId,v.candidateId,v.ip,v.ua,v.referrer]);download('court-evidence.csv',rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function restoreJSON(){try{const x=JSON.parse($('#restoreText').value);DB=x;save();toast('Database restored');renderHome()}catch(e){toast('Invalid JSON',false)}}
function factoryReset(){DB=clone(DEFAULT_DB);save();activeElection='';toast('Factory reset complete');setPage('home')}
function savePassword(){DB.settings.adminPassword=$('#newPass').value||'admin123';save();toast('Password saved')}
function saveAI(){DB.settings.aiEndpoint=$('#aiEndpoint').value;save();toast('AI settings saved')}
function saveSimple(k,id){DB.settings[k]=$('#'+id).value;save();toast('Saved')}
function addTestVote(){const e=$('#tvElection').value,c=$('#tvCandidate').value;DB.votes.push({id:'T'+Date.now().toString(36),electionId:e,candidateId:c,mobile:'TEST-'+Date.now(),time:new Date().toISOString(),test:true,ip:'test',ua:'test'});save();toast('Test vote added; excluded from public results')}
function resetWardVotes(){const eid=$('#resetElection').value,w=Number($('#resetWard').value);DB.votes=DB.votes.filter(v=>{if(v.electionId!==eid||v.test)return true;const c=DB.candidates.find(x=>x.id===v.candidateId);return Number(c?.wardNo)!==w});save();toast('Ward votes reset')}
function fillBulkSample(){
 $('#bulkText').value=`| Sr No. | District Name | ULB Name | Ward No. | Ward Reservation | Name | Gender | Age | Candidate Category | Party Name |\n| :- | :----- | :------------------- | :- | :------ | :----------- | :- | :- | :-------------- | :-- |\n| 1 | JALORE | BHINMAL NAGAR PALIKA | 4 | General | किशोर | M | 29 | OBC | IND |\n| 2 | JALORE | BHINMAL NAGAR PALIKA | 4 | General | विमला | F | 63 | General (Woman) | INC |\n| 3 | JALORE | BHINMAL NAGAR PALIKA | 4 | General | कैलाश कुमार | M | 22 | General | IND |\n| 4 | JALORE | BHINMAL NAGAR PALIKA | 4 | General | विक्रम कुमार | M | 31 | OBC | BJP |`}
function parseRows(text){const lines=text.replace(/\r/g,'').split('\n').map(s=>s.trim()).filter(Boolean).filter(l=>!/^\|?\s*:?-{2,}/.test(l));let rows=[];let delim=lines.some(l=>l.includes('|'))?'|':'\t';for(const line of lines){if(line.includes('|')){let x=line.replace(/^\|/,'').replace(/\|$/,'').split('|').map(v=>v.trim());if(x.length>=5)rows.push(x)}else if(line.includes('\t')){rows.push(line.split('\t').map(v=>v.trim()))}else if(line.includes(',')){rows.push(line.split(',').map(v=>v.trim()))}}return rows.filter(r=>r.some(x=>x));}
function norm(x){return String(x||'').toLowerCase().replace(/[.\-_/()]/g,' ').replace(/\s+/g,' ').trim()}
function findCol(headers,tests){for(const t of tests){const idx=headers.findIndex(h=>norm(h)===norm(t)||norm(h).includes(norm(t)));if(idx>=0)return idx}return -1}
function importBulk(){const text=$('#bulkText').value, rows=parseRows(text);let header=rows.find(r=>r.some(c=>norm(c).includes('district name'))&&r.some(c=>norm(c).includes('ward'))&&r.some(c=>norm(c)==='name'||norm(c).endsWith(' name')));if(!header){header=rows[0]}const hi=rows.indexOf(header);let data=rows.slice(hi+1).filter(r=>r.length>=5&&!norm(r[0]).includes('sr no'));if(!data.length){$('#bulkResult').innerHTML='<div class="service">No data rows recognized. Paste the SEC table including the header row.</div>';return}let iDistrict=findCol(header,['District Name','District']),iULB=findCol(header,['ULB Name','Local Body','ULB']),iWard=findCol(header,['Ward No','Ward']),iRes=findCol(header,['Ward Reservation','Reservation']),iName=findCol(header,['Name']),iGender=findCol(header,['Gender']),iAge=findCol(header,['Age']),iCat=findCol(header,['Candidate Category','Category']),iParty=findCol(header,['Party Name','Party']);if(iName<0){const guess=header.findIndex(h=>norm(h)==='name');iName=guess}let e=defaultElection();if(!e)return toast('Create an election first.',false);let added=0;const preview=[];for(const r of data){const name=String(r[iName]||'').trim();if(!name)continue;const c={id:'C'+Date.now().toString(36)+'_'+added,electionId:e.id,nameEn:name,nameHi:autoHindi(name),party:String(r[iParty]||'Independent').trim(),post:e.type==='Gram Panchayat'?'Ward Member':'Ward Candidate',wardNo:Number(r[iWard]||0),reservation:String(r[iRes]||''),gender:String(r[iGender]||''),age:Number(r[iAge]||0),category:String(r[iCat]||''),symbol:'',localUnit:String(r[iULB]||e.localUnit||''),district:String(r[iDistrict]||e.district||''),photo:defaultPhoto(r[iGender]||'')};DB.candidates.push(c);added++;preview.push(c)}save();$('#bulkResult').innerHTML=`<div class="service"><b>Imported ${added} candidate(s)</b><p>${preview.map(c=>esc(c.nameEn)+' → '+esc(c.nameHi)).join('<br>')}</p></div>`;}
function renderPublicMorePage(){ }
function init(){nav();makePages();$('#adminBtn').onclick=loginAdmin;$('#langHi').onclick=()=>{DB.settings.lang='hi';save();toast('हिंदी mode')};$('#langEn').onclick=()=>{DB.settings.lang='en';save();toast('English mode')};window.setPage=setPage;window.openAdminTool=openAdminTool;window.DB=DB;}
init();
</script>
