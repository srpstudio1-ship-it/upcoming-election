<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Universal Election Portal for configurable elections, geography, candidates, voting, results, analytics and administration.">
<title>Universal Election Portal</title>
<style>
:root{--navy:#08233d;--navy2:#103a5f;--saffron:#ff9933;--green:#138808;--white:#fff;--bg:#f4f7fa;--line:#dce5eb;--text:#173047;--muted:#647687;--danger:#d92d20;--success:#087f5b;--shadow:0 12px 36px rgba(10,43,67,.10);--radius:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#fff 0,#f3f7fa 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.container{width:min(1440px,calc(100% - 32px));margin:auto}.topbar{height:7px;background:linear-gradient(90deg,var(--saffron) 0 33.33%,#fff 33.33% 66.66%,var(--green) 66.66%)}header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.head{display:flex;align-items:center;gap:18px;padding:12px 0}.brand{display:flex;gap:12px;align-items:center;min-width:0}.brand-mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--saffron),#fff,var(--green));display:grid;place-items:center;color:var(--navy);font-weight:1000;box-shadow:var(--shadow)}.brand h1{font-size:18px;margin:0;color:var(--navy)}.brand p{font-size:11px;margin:3px 0 0;color:var(--muted)}.head-actions{margin-left:auto;display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:#fff;color:var(--navy);padding:10px 13px;border-radius:12px;font-weight:800}.btn:hover{box-shadow:0 8px 20px rgba(10,43,67,.08)}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.saffron{background:linear-gradient(90deg,var(--saffron),#ffc37c);color:var(--navy);border-color:#f7bf7a}.btn.green{background:linear-gradient(90deg,#d7f2e6,#8bd2b4);color:#063d2c;border-color:#a9ddc6}.btn.danger{background:#fff0ef;color:#a32920;border-color:#f1c0bb}.lang{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden}.lang button{border:0;background:#fff;padding:8px 10px;font-size:12px;font-weight:900}.lang button.active{background:var(--navy);color:#fff}.nav{border-top:1px solid var(--line);background:#f9fbfc}.nav-inner{display:flex;gap:6px;overflow:auto;padding:8px 0}.nav button{white-space:nowrap;border:0;background:transparent;color:var(--navy);padding:10px 12px;border-radius:10px;font-weight:800}.nav button.active,.nav button:hover{background:#eaf0f4}.page{display:none;padding:26px 0 110px}.page.active{display:block}.hero{border-radius:28px;background:linear-gradient(135deg,#09233b 0%,#16486b 52%,#0a5c3a 100%);color:#fff;box-shadow:0 18px 60px rgba(8,35,61,.22);padding:28px;display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.hero h2{margin:0;font-size:clamp(28px,4vw,48px);line-height:1.05}.hero p{color:#dceaf2;line-height:1.7}.hero-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.hero .ghost{border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff}.hero-card{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);border-radius:20px;padding:18px}.hero-card strong{font-size:28px;display:block}.grid{display:grid;gap:16px}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.section{margin-top:24px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}.section-head h3{margin:0;font-size:22px;color:var(--navy)}.section-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.stat{padding:20px}.stat small{color:var(--muted);display:block}.stat strong{font-size:30px;color:var(--navy);display:block;margin-top:7px}.feature-card{min-height:170px;display:flex;flex-direction:column;justify-content:space-between}.feature-icon{width:44px;height:44px;border-radius:13px;background:#eef4f8;display:grid;place-items:center;color:var(--navy);font-weight:1000}.feature-card h4{margin:12px 0 6px;font-size:15px}.feature-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.candidate-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}.candidate{background:#fff;border:2px solid #dbe5eb;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}.candidate.selected{border-color:var(--saffron);box-shadow:0 0 0 4px rgba(255,153,51,.18),var(--shadow)}.candidate-media{padding:13px;display:flex;align-items:end;justify-content:center;gap:9px}.cand-photo{width:92px;height:92px;border-radius:18px;object-fit:cover;border:3px solid #fff;box-shadow:0 8px 18px rgba(0,0,0,.12);background:#edf3f6}.cand-symbol{width:58px;height:58px;object-fit:contain;border:1px solid var(--line);border-radius:13px;padding:5px;background:#fff}.candidate-body{padding:0 13px 13px}.pill{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#eef4f8;color:var(--navy);font-size:10px;font-weight:900;margin:2px}.candidate h4{font-size:18px;margin:8px 0 3px;line-height:1.22}.candidate .en{font-size:12px;color:#607284;margin-bottom:9px}.candidate-info{display:grid;grid-template-columns:1fr 1fr;gap:7px}.info{border:1px solid #e2e9ee;background:#fafcfd;padding:8px;border-radius:11px;min-width:0}.info span{display:block;font-size:9px;color:#738494;font-weight:900}.info b{font-size:11px;display:block;margin-top:2px;word-break:break-word}.candidate-actions{padding:0 13px 13px;display:flex;gap:8px}.candidate-actions .btn{flex:1;font-size:11px;padding:9px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:10px;border-bottom:1px solid #e7edf1;text-align:left;font-size:12px}.table th{background:#f5f8fa;color:var(--navy);position:sticky;top:0}.field{display:grid;gap:6px}.field label{font-size:11px;font-weight:900;color:var(--navy)}.input{width:100%;border:1px solid #cdd9e1;border-radius:12px;padding:11px 12px;background:#fff;outline:none}.input:focus{border-color:#7ca5c3;box-shadow:0 0 0 4px rgba(28,91,137,.10)}textarea.input{min-height:120px;resize:vertical}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.toolbar .input{flex:1;min-width:180px}.page-tabs{display:flex;gap:7px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:15px}.page-tabs button{white-space:nowrap;border:0;background:transparent;padding:10px 12px;color:var(--muted);font-weight:900}.page-tabs button.active{color:var(--navy);border-bottom:3px solid var(--saffron)}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #cfdbe3;border-radius:16px;background:#fbfcfd}.notice{padding:14px 16px;border-left:5px solid var(--saffron);background:#fff8ef;border-radius:12px}.notice.success{border-left-color:var(--green);background:#f0fbf5}.notice.error{border-left-color:var(--danger);background:#fff3f2}.promo{border-radius:16px;padding:15px;color:#fff;background:linear-gradient(135deg,#0e3655,#0b6840);min-height:100px;display:flex;align-items:center;justify-content:space-between;gap:12px}.promo small{opacity:.8}.modal-backdrop{position:fixed;inset:0;background:rgba(4,21,34,.60);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}.modal-backdrop.show{display:flex}.modal{background:#fff;border-radius:22px;width:min(1100px,96vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.25)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#fff6eb,#fff,#eef9f1)}.modal-body{padding:18px;overflow:auto}.modal-close{border:0;background:#edf2f5;border-radius:10px;width:38px;height:38px}.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:200;display:grid;gap:9px}.toast{background:#08233d;color:#fff;padding:12px 15px;border-radius:12px;box-shadow:var(--shadow);max-width:360px;font-size:12px}.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:80;padding:8px;grid-template-columns:repeat(5,1fr);gap:5px}.mobile-nav button{border:0;background:transparent;color:var(--navy);padding:8px 4px;font-size:10px;font-weight:900}.admin-modal{width:min(1500px,98vw);height:92vh}.admin-layout{display:grid;grid-template-columns:300px 1fr;height:100%;min-height:0}.admin-sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.admin-search{padding:12px;border-bottom:1px solid var(--line)}.admin-search .input{background:#f8fafb}.admin-menu{overflow:auto;min-height:0;padding:8px}.admin-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:9px 10px;font-size:11px;font-weight:850;color:#42576a;margin-bottom:3px}.admin-menu button.active{background:#edf4f8;color:var(--navy);border-left:4px solid var(--saffron)}.admin-workspace{min-width:0;display:flex;flex-direction:column;min-height:0}.admin-top{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.admin-feature-scroll{overflow:auto;min-height:0;flex:1;padding:18px;background:#f7f9fb}.admin-console-scroll{overflow:auto}.subgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.codebox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b1d2d;color:#d4eefc;border-radius:14px;padding:13px;white-space:pre-wrap;font-size:11px;line-height:1.6;max-height:300px;overflow:auto}.checklist{display:grid;gap:8px}.check{display:flex;gap:8px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff}.ai-panel{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ai-chat{border:1px solid var(--line);border-radius:15px;display:flex;flex-direction:column;min-height:400px}.ai-log{flex:1;padding:12px;overflow:auto;background:#f7fafb}.bubble{max-width:86%;padding:10px 12px;border-radius:13px;margin:6px 0;font-size:12px;line-height:1.55;white-space:pre-wrap}.bubble.ai{background:#fff;border:1px solid var(--line)}.bubble.user{background:#dff0fb;margin-left:auto}.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{padding:15px;border:1px solid var(--line);border-radius:14px;background:#fff}.kpi b{display:block;font-size:22px;color:var(--navy)}.kpi span{font-size:10px;color:var(--muted)}
@media(max-width:1150px){.candidate-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.hero{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(3,minmax(0,1fr))}.admin-layout{grid-template-columns:260px 1fr}}
@media(max-width:900px){.candidate-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.admin-layout{grid-template-columns:220px 1fr}.kpi-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.container{width:min(100% - 18px,1440px)}.head{align-items:flex-start}.brand p{display:none}.brand h1{font-size:15px}.head-actions .btn:not(.primary){display:none}.nav{display:none}.page{padding-top:15px}.candidate-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cand-photo{width:76px;height:76px}.cand-symbol{width:48px;height:48px}.candidate h4{font-size:14px}.candidate .en{font-size:10px}.candidate-info{grid-template-columns:1fr}.grid4,.grid3,.grid2{grid-template-columns:1fr}.mobile-nav{display:grid}.promo{min-height:90px}.admin-layout{grid-template-columns:1fr}.admin-sidebar{display:none}.admin-workspace{height:calc(92vh - 70px)}.ai-panel{grid-template-columns:1fr}.subgrid{grid-template-columns:1fr}.hero{padding:20px}.hero h2{font-size:30px}}
@media(max-width:390px){.candidate-grid{grid-template-columns:1fr}.candidate-media{padding:12px}.candidate-info{grid-template-columns:1fr 1fr}.cand-photo{width:90px;height:90px}}
</style>
</head>
<body>
<div class="topbar"></div>
<header>
  <div class="container head">
    <div class="brand"><div class="brand-mark">UEP</div><div><h1 id="brandTitle">Universal Election Portal</h1><p id="brandSub">All Election Types · All Levels · One Platform</p></div></div>
    <div class="head-actions"><div class="lang"><button id="hiBtn" class="active">हिंदी</button><button id="enBtn">English</button></div><button class="btn primary" id="adminOpen">Admin</button></div>
  </div>
  <div class="nav"><div class="container nav-inner" id="nav"></div></div>
</header>
<main class="container">
  <section id="home" class="page active"></section>
  <section id="elections" class="page"></section>
  <section id="geography" class="page"></section>
  <section id="candidates" class="page"></section>
  <section id="voting" class="page"></section>
  <section id="results" class="page"></section>
  <section id="analytics" class="page"></section>
  <section id="stats" class="page"></section>
  <section id="notifications" class="page"></section>
  <section id="services" class="page"></section>
</main>
<div class="mobile-nav" id="mobileNav"></div>
<div class="toast-wrap" id="toasts"></div>
<div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-head"><div id="modalTitle"></div><button class="modal-close" id="modalClose">✕</button></div><div class="modal-body" id="modalBody"></div></div></div>
<div class="modal-backdrop" id="adminModal"><div class="modal admin-modal"><div class="modal-head"><div><strong>Administrator Console</strong><div id="adminStatus" style="font-size:11px;color:var(--muted)"></div></div><button class="modal-close" id="adminClose">✕</button></div><div class="admin-layout"><aside class="admin-sidebar"><div class="admin-search"><input class="input" id="adminFeatureSearch" placeholder="Search admin features..."></div><div class="admin-menu admin-console-scroll" id="adminMenu"></div></aside><section class="admin-workspace"><div class="admin-top"><div><strong id="adminFeatureTitle">Dashboard</strong><div id="adminFeatureDesc" style="font-size:11px;color:var(--muted)"></div></div><div class="toolbar"><button class="btn" id="adminBack">Home</button><button class="btn danger" id="adminLogout">Logout</button></div></div><div class="admin-feature-scroll" id="adminFeatureView"></div></section></div></div></div>
<script>
(()=>{
'use strict';
const KEY='UEP_100_FEATURE_DB_V1';
const LANG={hi:true};
const electionTypes=['Gram Panchayat','Nagar Palika','Panchayat Samiti','Zila Parishad','Municipal Corporation','Vidhan Sabha','Lok Sabha','Cooperative','College / University','Custom'];
const seedVillages=['BAGODA','BALI','BHALANI','BIJALIYA','CHENPURA','DHUMBADIYA','DUNGARAVA','JAISAWAS','JERAN','JETU','KALETI','KAVATARA','KHOKHA','KUKA','LAKHANI','LUNAVAS','MORSEEM','NANDIYA','NARSANA','NAVAPURA DHVECHA','NAYA MORSEEM','RAH','RANGALA','RAUTA','SEVADI','SOBADAWAS','VADA BHADAVI','Wada Naya'];
const symbols=['Sewing Machine','Bat','Ball','Balloon','Bicycle','Lotus','Tree','Chair','Table','Cup','Umbrella','Bell','Book','Pen','Key','Lock','Lamp','Fan','Clock','Mobile','Camera','Car','Bus','Tractor','Plough','Spade','Bucket','Jug','Glass','Basket','Ladder','Wheel','Star','Sun','Moon','Flower','Rose','Coconut','Mango','Banana','Apple','Kite','Boat','Airplane','House','Road Roller','Hand Pump','Bulb','Football','Cricket'];
const defaultGeo=()=>({states:[{id:'RJ',name:'Rajasthan',districts:[{id:'JALORE',name:'Jalore',blocks:[{id:'BAGODA',name:'Bagoda Tehsil',locals:seedVillages.map((x,i)=>({id:'L'+String(i+1).padStart(2,'0'),name:x,type:'Village',wards:0}))}]}]}]});
const freshDb=()=>({version:1,settings:{title:'Universal Election Portal',subtitle:'All Election Types · All Levels · One Platform',defaultLang:'hi',adminPassword:'admin123',maintenance:false,emergency:false,votingEnabled:true,resultsVisible:true,analyticsRefresh:10,otpDemo:true,aiProvider:'local',geminiKey:'',smsEndpoint:'',whatsappEndpoint:''},geography:defaultGeo(),elections:[],candidates:[],votes:[],nominations:[],notifications:[{id:'N1',title:'Portal Ready',body:'Create an election from Admin to begin.',time:new Date().toISOString(),live:true}],promos:[1,2,3,4,5].map((n,i)=>({id:n,title:['Local Sponsor','Citizen Service','Community Event','Business Promotion','Featured Service'][i],body:'Configure this promotion in Admin.',active:false,location:'slot'+n,link:'#'})),suggestions:[],feedback:[],logs:[],backups:[],featureUsage:{},custom:{}});
let db=loadDb(), lang=db.settings.defaultLang||'hi', currentPage='home', selectedElection='', selectedCandidate='', currentAdminFeature='dashboard', pendingOtp='', otpMobile='';
function loadDb(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&x.version?x:freshDb()}catch{return freshDb()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function id(prefix){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function toast(msg,type='info'){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.getElementById('toasts').appendChild(d);setTimeout(()=>d.remove(),3200)}
function t(hiText,enText){return lang==='hi'?hiText:enText}
function triline(hiText,enText){return `<div>${esc(lang==='hi'?hiText:enText)}</div>`}
function setLang(l){lang=l;localStorage.setItem('UEP_LANG',l);renderAll();}
lang=localStorage.getItem('UEP_LANG')||lang;
const navItems=[['home','होम','Home'],['elections','चुनाव','Elections'],['geography','भूगोल','Geography'],['candidates','उम्मीदवार','Candidates'],['voting','मतदान','Voting'],['results','परिणाम','Results'],['analytics','विश्लेषण','Analytics'],['stats','आँकड़े','Statistics'],['notifications','सूचनाएँ','Notifications'],['services','सेवाएँ','Services']];
function go(page){currentPage=page;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(page)?.classList.add('active');renderNav();window.scrollTo({top:0,behavior:'smooth'})}
function renderNav(){document.getElementById('nav').innerHTML=navItems.map(([id,hi,en])=>`<button class="${currentPage===id?'active':''}" onclick="UEP.go('${id}')">${lang==='hi'?hi:en}</button>`).join('');document.getElementById('mobileNav').innerHTML=[['home','⌂','होम'],['candidates','👤','उम्मीदवार'],['voting','✓','मतदान'],['results','▥','परिणाम'],['services','☰','सेवाएँ']].map(([id,ic,lab])=>`<button onclick="UEP.go('${id}')"><div style="font-size:16px">${ic}</div>${lang==='hi'?lab:id[0].toUpperCase()+id.slice(1)}</button>`).join('')}
function activeE(){return db.elections.find(e=>e.id===selectedElection)||db.elections.find(e=>e.status==='running')||db.elections[0]||null}
function allLocals(){const r=[];for(const s of db.geography.states){for(const d of s.districts){for(const b of d.blocks){for(const l of b.locals){r.push({...l,state:s.name,district:d.name,block:b.name});}}}}return r}
function hierarchy(){let html=`<div class="grid grid3"><div class="card"><b>State</b><p>Rajasthan</p></div><div class="card"><b>Districts</b><p>${db.geography.states.reduce((n,s)=>n+s.districts.length,0)}</p></div><div class="card"><b>Blocks / Tehsils</b><p>${db.geography.states.reduce((n,s)=>n+s.districts.reduce((a,d)=>a+d.blocks.length,0),0)}</p></div></div>`;return html}
function renderHome(){const e=activeE();const totalCandidates=e?db.candidates.filter(c=>c.electionId===e.id).length:0;const totalVotes=e?db.votes.filter(v=>v.electionId===e.id&&!v.test).length:0;const cards=[['🔔','Live Update','notifications'],['🔎','Search Candidate','candidates'],['🗳','Voting','voting'],['📊','Results','results'],['📈','Analytics','analytics'],['▥','Statistics','stats']];document.getElementById('home').innerHTML=`<div class="hero"><div><div style="font-size:11px;font-weight:900;opacity:.8">${esc(db.settings.subtitle)}</div><h2>${esc(db.settings.title)}</h2><p>${t('यह पोर्टल अलग-अलग प्रकार के चुनावों के लिए एक सार्वभौमिक मंच है।','A universal platform for configurable elections across local, state and national levels.')}</p><div class="hero-actions"><button class="btn saffron" onclick="UEP.go('elections')">${t('चुनाव चुनें','Choose Election')}</button><button class="btn ghost" onclick="UEP.go('geography')">${t('भूगोल देखें','Explore Geography')}</button></div></div><div class="hero-card"><small>${t('सक्रिय चुनाव','Active Election')}</small><strong>${esc(e?e.name:t('कोई चुनाव नहीं','No election'))}</strong><div style="margin-top:14px;color:#d4e4ed;font-size:13px">${e?esc(e.type):t('Admin में चुनाव बनाएं','Create one from Admin')}</div><div class="grid grid2" style="margin-top:14px"><div><small>${t('उम्मीदवार','Candidates')}</small><strong>${totalCandidates}</strong></div><div><small>${t('वोट','Votes')}</small><strong>${totalVotes}</strong></div></div></div></div><div class="section"><div class="section-head"><div><h3>${t('मुख्य सेवाएँ','Main Experience')}</h3><p>${t('होम पर केवल आवश्यक चीजें रखें। बाकी अलग पेज पर हैं।','Only essential tools are visible here; everything else lives on its own page.')}</p></div></div><div class="grid grid3">${cards.map(([i,hiText,p])=>`<button class="card feature-card" onclick="UEP.go('${p}')"><div class="feature-icon">${i}</div><div><h4>${t(hiText,hiText)}</h4><p>${t('सीधे संबंधित पेज खोलें','Open the dedicated page')}</p></div></button>`).join('')}</div></div><div class="section"><div class="grid grid3"><div class="stat card"><small>${t('कुल चुनाव','Total Elections')}</small><strong>${db.elections.length}</strong></div><div class="stat card"><small>${t('कुल स्थानीय इकाइयाँ','Local Units')}</small><strong>${allLocals().length}</strong></div><div class="stat card"><small>${t('कुल उम्मीदवार','All Candidates')}</small><strong>${db.candidates.length}</strong></div></div></div><div class="section"><div class="section-head"><div><h3>${t('प्रचार / Promotions','Promotions')}</h3><p>${t('सिर्फ Admin से प्रकाशित प्रमोशन यहाँ दिखेंगे।','Only promotions published from Admin appear here.')}</p></div></div><div class="grid grid3">${db.promos.filter(x=>x.active).slice(0,3).map(promoCard).join('')||'<div class="empty">No active promotion</div>'}</div></div>`}
function promoCard(p){return `<div class="promo"><div><small>${esc(p.title)}</small><div style="font-weight:900;margin-top:5px">${esc(p.body)}</div></div><a class="btn" style="background:#fff;color:var(--navy);text-decoration:none" href="${esc(p.link||'#')}" target="_blank" rel="noopener">Open</a></div>`}
function renderElections(){const q=(document.getElementById('eSearch')?.value||'').toLowerCase();const rows=db.elections.filter(e=>!q||[e.name,e.type,e.district,e.localType].join(' ').toLowerCase().includes(q));document.getElementById('elections').innerHTML=`<div class="section-head"><div><h3>${t('चुनाव','Elections')}</h3><p>${t('किसी भी चुनाव प्रकार को चुनें।','Select any election type.')}</p></div><button class="btn primary" onclick="UEP.openUserFeature('election-calendar')">${t('कैलेंडर','Calendar')}</button></div><div class="card"><div class="toolbar"><input class="input" id="eSearch" placeholder="${t('चुनाव खोजें','Search elections')}" value="${esc(q)}" oninput="UEP.renderElections()"><select class="input" id="eType"><option value="">${t('सभी प्रकार','All types')}</option>${electionTypes.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div></div><div class="section"><div class="grid grid2">${rows.map(e=>`<div class="card"><div class="toolbar" style="justify-content:space-between"><span class="pill">${esc(e.type)}</span><span class="pill">${esc(e.status)}</span></div><h3>${esc(e.name)}</h3><p style="color:var(--muted)">${esc(e.localType||'')}</p><p>${esc(e.district||'')} · ${esc(e.localUnit||'')}</p><div class="toolbar"><button class="btn primary" onclick="UEP.selectElection('${e.id}')">${t('चुनें','Select')}</button><button class="btn" onclick="UEP.openUserFeature('election-details',{id:'${e.id}'})">${t('विवरण','Details')}</button></div></div>`).join('')||'<div class="empty">No elections yet. Admin can create one.</div>'}</div></div>`}
function renderGeo(){document.getElementById('geography').innerHTML=`<div class="section-head"><div><h3>${t('भूगोल','Geography')}</h3><p>${t('State → District → Tehsil/Block → Local Unit → Ward hierarchy','State → District → Tehsil/Block → Local Unit → Ward hierarchy')}</p></div></div>${hierarchy()}<div class="section"><div class="table-wrap"><table class="table"><thead><tr><th>State</th><th>District</th><th>Block / Tehsil</th><th>Local Unit</th><th>Type</th><th>Wards</th></tr></thead><tbody>${allLocals().map(l=>`<tr><td>${esc(l.state)}</td><td>${esc(l.district)}</td><td>${esc(l.block)}</td><td>${esc(l.name)}</td><td>${esc(l.type)}</td><td>${l.wards||0}</td></tr>`).join('')}</tbody></table></div></div>`}
function candidateSymbol(name){const s=String(name||'').trim();const found=symbols.find(x=>x.toLowerCase()===s.toLowerCase());const label=found||s||'Symbol';return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><rect width="160" height="160" rx="24" fill="#fff"/><rect x="6" y="6" width="148" height="148" rx="20" fill="#f7f9fb" stroke="#c9d6df"/><text x="80" y="78" font-size="46" text-anchor="middle" dominant-baseline="middle">${label.slice(0,1).toUpperCase()}</text><text x="80" y="124" font-family="Arial" font-size="12" text-anchor="middle" fill="#24445c">${esc(label)}</text></svg>`)}
function defaultPhoto(){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" rx="30" fill="#edf4f8"/><circle cx="150" cy="105" r="55" fill="#9eb4c3"/><path d="M55 265c10-70 46-92 95-92s85 22 95 92" fill="#9eb4c3"/></svg>`)}
function renderCandidates(){const e=activeE();let rows=db.candidates.filter(c=>!e||c.electionId===e.id);const q=(document.getElementById('cSearch')?.value||'').trim().toLowerCase();const local=document.getElementById('cLocal')?.value||'';const ward=document.getElementById('cWard')?.value||'';rows=rows.filter(c=>!q||[c.nameHi,c.nameEn,c.party,c.post,c.symbol,c.localUnit,c.ward,c.category,c.gender].join(' ').toLowerCase().includes(q));rows=rows.filter(c=>!local||c.localUnit===local).filter(c=>!ward||String(c.ward)===ward);const locals=[...new Set(rows.map(c=>c.localUnit).filter(Boolean))];document.getElementById('candidates').innerHTML=`<div class="section-head"><div><h3>${t('उम्मीदवार','Candidates')}</h3><p>${e?esc(e.name):t('पहले चुनाव चुनें या Admin से चुनाव बनाएं','Select an election or create one in Admin')}</p></div><div class="toolbar"><button class="btn" onclick="UEP.openUserFeature('candidate-compare')">Compare</button><button class="btn" onclick="UEP.openUserFeature('candidate-translator')">${t('अनुवाद','Translator')}</button></div></div><div class="card"><div class="toolbar"><input class="input" id="cSearch" oninput="UEP.renderCandidates()" placeholder="${t('नाम / दल / वार्ड / चिन्ह खोजें','Search name / party / ward / symbol')}" value="${esc(q)}"><select class="input" id="cLocal" onchange="UEP.renderCandidates()"><option value="">${t('सभी स्थानीय इकाइयाँ','All local units')}</option>${locals.map(x=>`<option ${x===local?'selected':''}>${esc(x)}</option>`).join('')}</select><input class="input" id="cWard" oninput="UEP.renderCandidates()" placeholder="Ward" value="${esc(ward)}"></div></div><div class="section"><div class="candidate-grid">${rows.map(candidateCard).join('')||'<div class="empty" style="grid-column:1/-1">0 candidates. Add or import candidates from Admin.</div>'}</div></div>`}
function candidateCard(c){const selected=selectedCandidate===c.id;return `<article class="candidate ${selected?'selected':''}"><div class="candidate-media"><img class="cand-photo" src="${esc(c.photo||defaultPhoto())}" alt=""><img class="cand-symbol" src="${esc(c.symbolImage||candidateSymbol(c.symbol))}" alt=""></div><div class="candidate-body"><div><span class="pill">${t('वार्ड','Ward')} ${esc(c.ward)}</span><span class="pill">${esc(c.party||'IND')}</span></div><h4>${esc(c.nameHi||c.nameEn)}</h4><div class="en">${esc(c.nameEn||c.nameHi||'')}</div><div class="candidate-info"><div class="info"><span>${t('पद','Post')}</span><b>${esc(c.post||'')}</b></div><div class="info"><span>${t('श्रेणी','Category')}</span><b>${esc(c.category||'')}</b></div><div class="info"><span>${t('उम्र','Age')}</span><b>${esc(c.age||'')}</b></div><div class="info"><span>${t('लिंग','Gender')}</span><b>${esc(c.gender||'')}</b></div><div class="info"><span>${t('स्थान','Local Unit')}</span><b>${esc(c.localUnit||'')}</b></div><div class="info"><span>${t('चिन्ह','Symbol')}</span><b>${esc(c.symbol||'')}</b></div></div></div><div class="candidate-actions"><button class="btn ${selected?'saffron':''}" onclick="UEP.selectCandidate('${c.id}')">${selected?t('चयनित','Selected'):t('चुनें','Select')}</button><button class="btn" onclick="UEP.openUserFeature('candidate-details',{id:'${c.id}'})">${t('विवरण','Details')}</button></div></article>`}
function renderVoting(){const e=activeE();const c=selectedCandidate?db.candidates.find(x=>x.id===selectedCandidate):null;document.getElementById('voting').innerHTML=`<div class="section-head"><div><h3>${t('मतदान','Voting')}</h3><p>${e?esc(e.name):t('चुनाव उपलब्ध नहीं','No election selected')}</p></div></div><div class="card">${!e?'<div class="empty">No election available.</div>':e.status!=='running'?'<div class="notice">Voting is not started. Admin must open the voting window.</div>':`<div class="grid grid2"><div class="field"><label>${t('उम्मीदवार','Candidate')}</label><select class="input" id="vCandidate"><option value="">${t('उम्मीदवार चुनें','Select candidate')}</option>${db.candidates.filter(x=>x.electionId===e.id).map(x=>`<option value="${x.id}" ${x.id===selectedCandidate?'selected':''}>${esc(x.nameHi||x.nameEn)} — ${esc(x.party||'')}</option>`).join('')}</select></div><div class="field"><label>${t('मोबाइल नंबर','Mobile number')}</label><input class="input" id="vMobile" inputmode="numeric" maxlength="10" placeholder="10 digits"></div></div><div class="toolbar" style="margin-top:12px"><button class="btn" id="otpBtn" onclick="UEP.requestOtp()">${t('OTP भेजें','Send OTP')}</button><input class="input" id="vOtp" placeholder="OTP" maxlength="6" style="max-width:180px"><button class="btn primary" onclick="UEP.castVote()">${t('वोट दें','Cast Vote')}</button></div><div id="otpHint" class="notice" style="margin-top:10px;display:none"></div>`}</div>`;const vc=document.getElementById('vCandidate');if(vc)vc.onchange=()=>{selectedCandidate=vc.value;renderVoting();};}
function renderResults(){const e=activeE();const rows=e?db.candidates.filter(c=>c.electionId===e.id).map(c=>({c,v:db.votes.filter(v=>v.electionId===e.id&&v.candidateId===c.id&&!v.test).length})).sort((a,b)=>b.v-a.v):[];const total=rows.reduce((n,x)=>n+x.v,0);document.getElementById('results').innerHTML=`<div class="section-head"><div><h3>${t('परिणाम','Results')}</h3><p>${e?esc(e.name):'No election'}</p></div><button class="btn" onclick="window.print()">Print</button></div><div class="grid grid4"><div class="stat card"><small>Total Votes</small><strong>${total}</strong></div><div class="stat card"><small>Candidates</small><strong>${rows.length}</strong></div><div class="stat card"><small>Turnout records</small><strong>${db.votes.filter(v=>e&&v.electionId===e.id&&!v.test).length}</strong></div><div class="stat card"><small>Visible</small><strong>${db.settings.resultsVisible?'Yes':'No'}</strong></div></div><div class="section"><div class="card">${db.settings.resultsVisible?rows.map((x,i)=>`<div style="display:grid;grid-template-columns:40px 1fr 100px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #e8eef2"><b>#${i+1}</b><div><strong>${esc(x.c.nameHi||x.c.nameEn)}</strong><div style="font-size:11px;color:var(--muted)">${esc(x.c.nameEn||'')} · ${esc(x.c.party||'')}</div><div style="height:8px;background:#edf2f5;border-radius:999px;overflow:hidden;margin-top:6px"><div style="height:100%;background:linear-gradient(90deg,var(--saffron),var(--green));width:${total?x.v/total*100:0}%"></div></div></div><strong style="text-align:right">${x.v} · ${total?(x.v/total*100).toFixed(1):0}%</strong></div>`).join('')||'<div class="empty">No candidates/votes yet.</div>':'<div class="notice">Public results are hidden by Admin.</div>'}</div></div>`}
function renderAnalytics(){const e=activeE();const vs=db.votes.filter(v=>e&&v.electionId===e.id&&!v.test);const candidates=e?db.candidates.filter(c=>c.electionId===e.id):[];document.getElementById('analytics').innerHTML=`<div class="section-head"><div><h3>Analytics</h3><p>Live calculations from the same local database.</p></div></div><div class="grid grid4">${[['Votes',vs.length],['Candidates',candidates.length],['Local units',[...new Set(candidates.map(c=>c.localUnit).filter(Boolean))].length],['Parties',[...new Set(candidates.map(c=>c.party).filter(Boolean))].length]].map(x=>`<div class="stat card"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><div class="section card"><h4>Candidate vote share</h4>${candidates.length?candidates.map(c=>{const n=vs.filter(v=>v.candidateId===c.id).length;return `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${esc(c.nameHi||c.nameEn)}</span><b>${n}</b></div><div style="height:10px;background:#edf2f5;border-radius:999px"><div style="height:100%;width:${vs.length?n/vs.length*100:0}%;background:linear-gradient(90deg,var(--saffron),var(--green));border-radius:999px"></div></div></div>`}).join(''):'<div class="empty">No vote data.</div>'}</div>`}

function openModal(title,html){document.getElementById('modalTitle').innerHTML=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}

rnment sources.');case'election-select':go('elections');return;case'election-details':{const e=db.elections.find(x=>x.id===c)||activeE();return openModal('Election Details',e?`<div class="checklist"><div class="check"><b>Name</b><span>${esc(e.name)}</span></div><div class="check"><b>Type</b><span>${esc(e.type)}</span></div><div class="check"><b>Status</b><span>${esc(e.status)}</span></div></div>`:'No election')}case'election-calendar':return openModal('Election Calendar',db.elections.map(e=>`<div class="check"><b>${esc(e.name)}</b><span>${esc(e.startDate||'')} → ${esc(e.endDate||'')}</span></div>`).join('')||'<div class="empty">No elections.</div>');default:return openModal('Feature',`<div class="notice">${esc(key)}</div>`)}}

function openMyVote(){const m=prompt('Enter mobile number');if(!m)return;const rows=db.votes.filter(v=>v.mobile===m&&!v.test).map(v=>{const c=db.candidates.find(c=>c.id===v.candidateId);const e=db.elections.find(e=>e.id===v.electionId);return `<div class="check"><b>${esc(e?.name||'')}</b><span>${esc(c?.nameHi||c?.nameEn||'')} · ${esc(v.receipt)}</span></div>`}).join('');openModal('My Vote Record',rows||'<div class="empty">No record found.</div>')}

function requestOtp(){const m=document.getElementById('vMobile')?.value.trim();if(!/^\d{10}$/.test(m))return toast('Enter 10-digit mobile','error');otpMobile=m;pendingOtp=String(Math.floor(100000+Math.random()*900000));const hint=document.getElementById('otpHint');if(hint){hint.style.display='block';hint.textContent=db.settings.otpDemo?'Demo OTP: '+pendingOtp:'OTP request sent to configured provider.'}toast('OTP generated','success')}
function castVote(){const e=activeE();const c=document.getElementById('vCandidate')?.value||selectedCandidate;const m=document.getElementById('vMobile')?.value.trim();const o=document.getElementById('vOtp')?.value.trim();if(!e||e.status!=='running')return toast('Voting is not open','error');if(!c)return toast('Select candidate','error');if(!/^\d{10}$/.test(m))return toast('Enter valid mobile','error');if(!otpMobile||otpMobile!==m)return toast('Request OTP first','error');if(db.settings.otpDemo&&o!==pendingOtp)return toast('Wrong OTP','error');if(db.votes.some(v=>v.electionId===e.id&&v.mobile===m&&!v.test))return toast('Mobile already voted','error');const receipt=id('VOTE');db.votes.push({id:id('V'),electionId:e.id,candidateId:c,mobile:m,receipt,time:new Date().toISOString(),test:false});db.logs.push({id:id('L'),action:'vote',receipt,time:new Date().toISOString()});save();pendingOtp='';otpMobile='';toast('Vote recorded · '+receipt,'success');renderAll()}

const dict={'candidate':'उम्मीदवार','name':'नाम','district':'जिला','state':'राज्य','ward':'वार्ड','village':'गाँव','local unit':'स्थानीय इकाई','block':'ब्लॉक','tehsil':'तहसील','party':'दल','party name':'दल का नाम','gender':'लिंग','age':'उम्र','category':'श्रेणी','general':'सामान्य','woman':'महिला','man':'पुरुष','independent':'निर्दलीय','sarpanch':'सरपंच','member':'सदस्य','president':'अध्यक्ष','councillor':'पार्षद','chairperson':'सभापति','panchayat':'पंचायत','municipality':'नगर पालिका','municipal corporation':'नगर निगम','election':'चुनाव','result':'परिणाम','vote':'वोट','symbol':'चिन्ह','reservation':'आरक्षण','general (woman)':'सामान्य (महिला)','obc':'ओबीसी','sc':'एससी','st':'एसटी'};
async function translateText(text,sl,tl){const q=String(text||'').trim();if(!q)return '';try{const u='https://translate.googleapis.com/translate_a/single?client=gtx&sl='+encodeURIComponent(sl)+'&tl='+encodeURIComponent(tl)+'&dt=t&q='+encodeURIComponent(q);const r=await fetch(u);const j=await r.json();return Array.isArray(j)&&Array.isArray(j[0])?j[0].map(x=>x[0]).join(''):q}catch{if(sl==='en'&&tl==='hi'){return q.split(/(\s+|[,.:;()\-\/])/).map(tok=>dict[tok.toLowerCase()]||transliterate(tok)).join('')}return q}}
function transliterate(s){const map={'a':'अ','b':'ब','c':'क','d':'ड','e':'ए','f':'फ','g':'ग','h':'ह','i':'इ','j':'ज','k':'क','l':'ल','m':'म','n':'न','o':'ओ','p':'प','q':'क','r':'र','s':'स','t':'ट','u':'उ','v':'व','w':'व','x':'क्स','y':'य','z':'ज'};return /^[A-Za-z]+$/.test(s)?s.toLowerCase().split('').map(x=>map[x]||x).join(''):s}
async function translateNow(){const en=document.getElementById('trEn').value;document.getElementById('trHi').value='Translating...';document.getElementById('trHi').value=await translateText(en,'en','hi')}
async function reverseTranslate(){const hi=document.getElementById('trHi').value;document.getElementById('trEn').value='Translating...';document.getElementById('trEn').value=await translateText(hi,'hi','en')}

function normalizeHeader(s){return String(s||'').toLowerCase().replace(/\*|`/g,'').replace(/[^a-z0-9\u0900-\u097f]+/g,' ').trim()}
function headerScore(h){const n=normalizeHeader(h);if(/sr\s*no|serial/.test(n))return 'sr';if(/district/.test(n))return 'district';if(/ulb|municipal|local unit|gram panchayat|nagar/.test(n))return 'localUnit';if(/ward no|ward number/.test(n))return 'ward';if(/ward reservation|reservation/.test(n))return 'reservation';if(/^name$|candidate name|नाम$/.test(n)||n.endsWith(' name'))return 'name';if(/gender|sex/.test(n))return 'gender';if(/age/.test(n))return 'age';if(/candidate category|category/.test(n))return 'category';if(/party name|party/.test(n))return 'party';if(/post/.test(n))return 'post';if(/state/.test(n))return 'state';if(/block|tehsil/.test(n))return 'block';return null}
function splitRow(line){let s=line.trim();if(!s)return [];if(s.includes('|')){return s.replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim())}if(s.includes('\t'))return s.split('\t').map(x=>x.trim());return s.split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/).map(x=>x.trim().replace(/^\"|\"$/g,''))}
function isSep(cells){return cells.length>0&&cells.every(c=>/^:?-{2,}:?$/.test(String(c).replace(/\s/g,''))||String(c).trim()==='')}
function parseBulk(text){const raw=String(text||'').split(/\r?\n/);const rows=[];for(const line of raw){let x=line.trim();if(!x)continue;const cells=splitRow(x);if(!cells.length||isSep(cells))continue;rows.push(cells)}let headerIdx=-1,map={};for(let i=0;i<Math.min(rows.length,15);i++){const m={};rows[i].forEach((h,j)=>{const k=headerScore(h);if(k)m[k]=j});if(Object.keys(m).length>=4){headerIdx=i;map=m;break}}
  // SEC copy/paste sometimes collapses the header into one cell. For 10-column candidate tables, infer the standard SEC order.
  const standard={sr:0,district:1,localUnit:2,ward:3,reservation:4,name:5,gender:6,age:7,category:8,party:9};
  if(headerIdx<0){const dataRows=rows.filter(r=>r.length>=8);const sample=dataRows.find(r=>r.length>=10);if(sample){headerIdx=-1;map=standard}else{throw new Error('Header not found. Required columns include Name, Ward, Party and preferably District/Local Unit.')}}
  const out=[];for(let i=headerIdx+1;i<rows.length;i++){const r=rows[i];if(!r.length||isSep(r))continue;const joined=r.join(' ').toLowerCase();if(/sr\s*no.*district.*ward.*name.*gender.*age.*party/.test(joined)||/district nameulb nameward/.test(joined))continue;const name=String(r[map.name]||'').replace(/^\*+|\*+$/g,'').trim();if(!name||name.toLowerCase()==='name'||name.toLowerCase()==='candidate name')continue;const obj={sr:r[map.sr]||'',district:r[map.district]||'',localUnit:r[map.localUnit]||'',ward:r[map.ward]||'',reservation:r[map.reservation]||'',nameHi:name,nameEn:'',gender:r[map.gender]||'',age:r[map.age]||'',category:r[map.category]||'',party:r[map.party]||'IND',post:r[map.post]||'',state:r[map.state]||'Rajasthan',block:r[map.block]||''};if(!obj.nameHi&&!obj.party&&!obj.ward)continue;out.push(obj)}return {map,rows:out}}
function previewBulk(){try{const x=parseBulk(document.getElementById('bulkText').value);document.getElementById('bulkPreview').innerHTML=`<div class="notice success">Parsed ${x.rows.length} candidate rows successfully.</div><div class="table-wrap" style="margin-top:10px"><table class="table"><thead><tr><th>Name</th><th>District</th><th>ULB/Local Unit</th><th>Ward</th><th>Reservation</th><th>Gender</th><th>Age</th><th>Category</th><th>Party</th></tr></thead><tbody>${x.rows.map(r=>`<tr>${['nameHi','district','localUnit','ward','reservation','gender','age','category','party'].map(k=>`<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}catch(e){document.getElementById('bulkPreview').innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
function ensureLocal(name,type='Village',state='Rajasthan',district='Jalore',block='Bagoda Tehsil',wards=0){let st=db.geography.states.find(x=>x.name.toLowerCase()===state.toLowerCase());if(!st){st={id:id('ST'),name:state,districts:[]};db.geography.states.push(st)}let d=st.districts.find(x=>x.name.toLowerCase()===district.toLowerCase());if(!d){d={id:id('DI'),name:district,blocks:[]};st.districts.push(d)}let b=d.blocks.find(x=>x.name.toLowerCase()===block.toLowerCase());if(!b){b={id:id('BL'),name:block,locals:[]};d.blocks.push(b)}let l=b.locals.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!l){l={id:id('LO'),name,type,wards:Number(wards)||0};b.locals.push(l)}else if(Number(wards)>l.wards)l.wards=Number(wards);return l}
function importBulk(){try{const x=parseBulk(document.getElementById('bulkText').value);let eid=document.getElementById('biElection').value;if(!eid){return toast('Create/select an election first','error')}let added=0;for(const r of x.rows){const l=ensureLocal(r.localUnit||document.getElementById('biLocal').value||'Imported Local Unit','Local Unit',r.state||'Rajasthan',r.district||'Jalore',r.block||'Bagoda Tehsil',Math.max(Number(r.ward)||0,0));db.candidates.push({id:id('C'),electionId:eid,nameHi:r.nameHi,nameEn:r.nameEn||'',district:r.district,localUnit:l.name,ward:r.ward,reservation:r.reservation,gender:r.gender,age:r.age,category:r.category,party:r.party||'IND',post:r.post||document.getElementById('biPost').value||'',symbol:'',symbolImage:candidateSymbol(''),photo:defaultPhoto(),created:new Date().toISOString()});added++}save();document.getElementById('bulkPreview').innerHTML=`<div class="notice success">Imported ${added} candidates successfully.</div>`;renderAll();toast(added+' candidates imported','success')}catch(e){toast(e.message,'error')}}

function createElection(){const name=document.getElementById('newEName').value.trim();if(!name)return toast('Enter election name','error');const e={id:id('E'),name,type:document.getElementById('newEType').value,district:document.getElementById('newEDistrict').value,localUnit:document.getElementById('newELocal').value,startDate:document.getElementById('newEStart').value,endDate:document.getElementById('newEEnd').value,status:'draft',created:new Date().toISOString()};db.elections.push(e);selectedElection=e.id;save();toast('Election created','success');renderAll();openAdminFeature('election-manager')}

function addLocalUnit(){const name=document.getElementById('gLocalNew').value.trim();if(!name)return toast('Enter local unit','error');ensureLocal(name,document.getElementById('gTypeNew').value,document.getElementById('gStateNew').value,document.getElementById('gDistrictNew').value,document.getElementById('gBlockNew').value,Number(document.getElementById('gWardsNew').value)||0);save();toast('Local unit added','success');renderAll();openAdminFeature('geography-manager')}

function locRef(name){for(const s of db.geography.states)for(const d of s.districts)for(const b of d.blocks){const l=b.locals.find(x=>x.name===name);if(l)return {state:s,district:d,block:b,local:l}}return null}
function addCandidate(){const c={id:id('C'),electionId:document.getElementById('cmElection').value,nameHi:document.getElementById('cmHi').value.trim(),nameEn:document.getElementById('cmEn').value.trim(),partyEn:document.getElementById('cmPartyEn').value.trim(),partyHi:document.getElementById('cmPartyHi').value.trim(),party:'',postEn:document.getElementById('cmPostEn').value.trim(),postHi:document.getElementById('cmPostHi').value.trim(),post:'',categoryEn:document.getElementById('cmCatEn').value.trim(),categoryHi:document.getElementById('cmCatHi').value.trim(),category:'',localUnit:document.getElementById('cmLocal').value.trim(),ward:document.getElementById('cmWard').value,gender:document.getElementById('cmGender').value,age:document.getElementById('cmAge').value,symbol:document.getElementById('cmSymbol').value,photo:document.getElementById('cmPhoto').value||defaultPhoto(),symbolImage:candidateSymbol(document.getElementById('cmSymbol').value)};c.party=c.partyHi||c.partyEn||'Independent';c.post=c.postHi||c.postEn||'';c.category=c.categoryHi||c.categoryEn||'General';if(!c.electionId||!c.nameHi&&!c.nameEn)return toast('Election and candidate name required','error');db.candidates.push(c);save();toast('Candidate saved','success');renderAll();openAdminFeature('candidate-manager')}

function reconcile(){const orphans=db.votes.filter(v=>!db.elections.some(e=>e.id===v.electionId)||!db.candidates.some(c=>c.id===v.candidateId));document.getElementById('reconcileOut').innerHTML=`<div class="notice ${orphans.length?'error':'success'}">${orphans.length?'Found '+orphans.length+' orphan vote rows.':'No orphan vote rows found.'}</div>`}
function setResultsVisibility(){db.settings.resultsVisible=document.getElementById('rv').checked;save();toast('Results visibility saved','success');renderAll()}
function downloadExport(type){let data;if(type==='json'){data=JSON.stringify(db,null,2);download('election-database.json',data,'application/json')}else{const rows=[['Vote ID','Election','Candidate','Mobile','Time','Test']];db.votes.forEach(v=>rows.push([v.id,db.elections.find(e=>e.id===v.electionId)?.name||'',db.candidates.find(c=>c.id===v.candidateId)?.nameHi||'',v.mobile,v.time,v.test]));download('votes.csv',rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')} }
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importJson(){try{const x=JSON.parse(document.getElementById('jsonIn').value);if(!x||!x.elections||!x.candidates)throw new Error('Invalid database JSON');db=x;save();toast('Database imported','success');renderAll()}catch(e){toast(e.message,'error')}}
function backup(){db.backups=db.backups||[];db.backups.push({time:new Date().toISOString(),data:JSON.stringify({...db,backups:[]})});save();toast('Snapshot created','success');openAdminFeature('backup-snapshot')}
function restoreBackup(i){const b=db.backups[i];if(!b)return;const x=JSON.parse(b.data);x.backups=db.backups;db=x;save();toast('Snapshot restored','success');renderAll();openAdminFeature('restore-snapshot')}
function addNotification(){const n={id:id('N'),title:document.getElementById('nTitle').value.trim(),body:document.getElementById('nBody').value.trim(),live:document.getElementById('nLive').checked,time:new Date().toISOString()};if(!n.title)return toast('Title required','error');db.notifications.unshift(n);save();renderNotifications();toast('Notification published','success');openAdminFeature('notification-manager')}
function deleteNotification(idv){db.notifications=db.notifications.filter(x=>x.id!==idv);save();renderAll();openAdminFeature('notification-manager')}
function deleteModeration(type,i){db[type].splice(i,1);save();openAdminFeature(type==='suggestions'?'suggestions-manager':'feedback-manager')}
function savePromo(n){const p=db.promos.find(x=>x.id===n);if(!p)return;p.title=document.getElementById('pTitle').value;p.body=document.getElementById('pBody').value;p.link=document.getElementById('pLink').value;p.active=document.getElementById('pActive').checked;save();toast('Promotion saved','success');renderAll();openAdminFeature('promotions-dashboard')}
function saveBranding(){db.settings.title=document.getElementById('bTitle').value;db.settings.subtitle=document.getElementById('bSub').value;save();toast('Branding saved','success');renderAll()}
function addStore(key){db[key]=db[key]||[];const n=document.getElementById('storeName').value.trim();if(!n)return toast('Enter name','error');db[key].push({id:id('S'),name:n});save();openAdminFeature(currentAdminFeature)}function removeStore(key,i){db[key].splice(i,1);save();openAdminFeature(currentAdminFeature)}
function saveCandidatePhotoFromData(){return}
function adminAskAI(){const q=document.getElementById('adminAiInput').value.trim();if(!q)return;const log=document.getElementById('adminAiLog');log.insertAdjacentHTML('beforeend',`<div class="bubble user">${esc(q)}</div>`);let a;if(/candidate|उम्मीदवार/.test(q.toLowerCase()))a='Candidates: '+db.candidates.length+'. Use Candidate Manager or Bulk Candidate Import.';else if(/vote|वोट/.test(q.toLowerCase()))a='Non-test votes: '+db.votes.filter(v=>!v.test).length+'. Test votes: '+db.votes.filter(v=>v.test).length+'.';else if(/election|चुनाव/.test(q.toLowerCase()))a='Elections: '+db.elections.length+'. Running: '+db.elections.filter(e=>e.status==='running').length+'.';else if(/import|bulk|आयात/.test(q.toLowerCase()))a='Use Bulk Candidate Import. It accepts Markdown, TSV and CSV and ignores repeated header/separator rows.';else a='I can help with elections, geography, candidates, imports, votes, results, analytics, notifications, promotions and system settings.';log.insertAdjacentHTML('beforeend',`<div class="bubble ai">${esc(a)}</div>`);log.scrollTop=log.scrollHeight;document.getElementById('adminAiInput').value=''}
function factoryReset(){if(!confirm('Factory reset will delete local election data. Continue?'))return;db=freshDb();save();selectedElection='';selectedCandidate='';toast('Factory reset complete','success');renderAll();openAdminFeature('dashboard')}
function renderServices(){document.getElementById('services').innerHTML=`<div class="section-head"><div><h3>${t('40 सार्वजनिक सेवाएँ','40 Public Features')}</h3><p>Every feature below opens its own working panel or dedicated page.</p></div></div><div class="grid grid4">${userFeatures.map(([k,n],i)=>`<button class="card feature-card" onclick="UEP.openUserFeature('${k}')"><div class="feature-icon">${String(i+1).padStart(2,'0')}</div><div><h4>${esc(n)}</h4><p>Open feature</p></div></button>`).join('')}</div>`}
function renderAll(){document.getElementById('brandTitle').textContent=db.settings.title;document.getElementById('brandSub').textContent=db.settings.subtitle;renderHome();renderElections();renderGeo();renderCandidates();renderVoting();renderResults();renderAnalytics();renderStats();renderNotifications();renderServices();renderNav();}
// bindings
window.UEP={go,renderElections,renderCandidates,selectElection,selectCandidate,openUserFeature,requestOtp,castVote,openAdminFeature,closeAdmin,adminAskAI,toggleBig,toggleContrast,toggleMotion,saveSuggestion,saveFeedback,translateNow,reverseTranslate,translateAdminField,translateAllAdminFields,translateCandidateForm,createElection,setElectionStatus,addLocalUnit,addWard,addCandidate,deleteCandidate,saveCandidatePhoto,defaultCandidatePhoto,previewSymbol,saveSymbol,saveNomination,saveSettings,saveElectionSchedule,addTestVote,reconcile,setResultsVisibility,downloadExport,importJson,backup,restoreBackup,addNotification,deleteNotification,deleteModeration,savePromo,saveBranding,addStore,removeStore,factoryReset,renderAllPages:renderAll};
document.getElementById('hiBtn').onclick=()=>setLang('hi');document.getElementById('enBtn').onclick=()=>setLang('en');document.getElementById('adminOpen').onclick=openAdmin;document.getElementById('adminClose').onclick=closeAdmin;document.getElementById('modalClose').onclick=closeModal;document.getElementById('adminLogout').onclick=closeAdmin;document.getElementById('adminBack').onclick=()=>openAdminFeature('dashboard');document.getElementById('adminFeatureSearch').oninput=e=>renderAdminMenu(e.target.value);document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
renderAll();
setInterval(()=>{if(currentPage==='results')renderResults();if(currentPage==='analytics')renderAnalytics();if(currentAdminFeature==='live-vote-monitor')openAdminFeature('live-vote-monitor')},Math.max(5,Number(db.settings.analyticsRefresh)||10)*1000);
})();
</script>
