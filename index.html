function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function t(hi,en){return lang==='hi'?hi:en}
function toast(msg,err=false){const d=document.createElement('div');d.className='toast'+(err?' err':'');d.textContent=msg;document.getElementById('toastBox').appendChild(d);setTimeout(()=>d.remove(),3200)}
function setLang(v){lang=v==='en'?'en':'hi';db.settings.lang=lang;save();renderNav();renderPage(currentPage||'dashboard');}
let currentPage='dashboard';
function renderNav(){const nav=document.getElementById('mainNav');nav.innerHTML=BASE_FEATURES.slice(0,11).map(x=>`<button class="${currentPage===x[0]?'active':''}" onclick="go('${x[0]}')">${lang==='hi'?x[1]:x[2]}</button>`).join('')+`<button onclick="openServices()">${t('सभी सेवाएँ','All Services')}</button>`}
function go(page){currentPage=page;renderNav();renderPage(page);window.scrollTo({top:0,behavior:'smooth'})}
function titleFor(key,arr=BASE_FEATURES.concat(ADMIN_FEATURES)){const x=arr.find(y=>y[0]===key);return x?lang==='hi'?(x[1]||x[2]):(x[2]||x[1]):key}
function pageWrap(title,sub,body){return `<div class="shell"><div class="pageHead"><div><h2>${esc(title)}</h2><p>${esc(sub||'')}</p></div><div class="chips"><span class="chip">${db.elections.length} elections</span><span class="chip">${db.candidates.length} candidates</span><span class="chip">${db.votes.length} votes</span></div></div>${body}</div>`}
function renderPage(page){document.getElementById('publicRoot').innerHTML=getPublicPage(page)}
function promo(id){const p=db.promotions.find(x=>x.id===id);if(!p||!p.enabled)return '';return `<div class="promo"><b>${esc(lang==='hi'?p.titleHi:p.titleEn)}</b><small>${esc(lang==='hi'?p.bodyHi:p.bodyEn)}</small>${p.url&&p.url!=='#'?`<div style="margin-top:8px"><a class="btn small" href="${esc(p.url)}" target="_blank">${t('खोलें','Open')}</a></div>`:''}</div>`}
function getPublicPage(page){
 if(page==='dashboard')return pageWrap('', '', `<div class="live"><span class="dot"></span><b>${t('लाइव अपडेट','Live Update')}:</b><span>${esc(lang==='hi'?db.notifications[0]?.hi||'कोई सूचना नहीं':db.notifications[0]?.en||'No notification')}</span></div><div class="hero"><div class="heroMain"><div class="chips"><span class="chip">${t('सभी प्रकार के चुनाव','All Election Types')}</span><span class="chip">${t('मोबाइल फ्रेंडली','All Devices')}</span></div><h2>${t('एक ही पोर्टल में पूरे चुनाव की जानकारी','Complete election information in one portal')}</h2><p>${t('ग्राम पंचायत से नगर पालिका, पंचायत समिति, जिला परिषद, विधानसभा, लोकसभा और अन्य चुनाव। चुनाव, भूगोल, उम्मीदवार, मतदान, परिणाम और विश्लेषण अलग-अलग पेज पर रखें।','From Gram Panchayat to Nagar Palika, Panchayat Samiti, Zila Parishad, Assembly, Lok Sabha and custom elections. Separate pages keep the portal easy to use.')}</p><div class="toolbar"><button class="btn primary" onclick="go('elections')">${t('चुनाव चुनें','Select Election')}</button><button class="btn dark" onclick="go('candidates')">${t('उम्मीदवार देखें','View Candidates')}</button></div><div class="grid cards3" style="margin-top:18px"><div>${promo('promo1')}</div><div>${promo('promo2')}</div><div>${promo('promo3')}</div></div></div><div class="heroSide"><div class="pageHead"><div><h3 style="margin:0">${t('सिस्टम सारांश','System Summary')}</h3><p>${t('सभी काउंट शून्य से शुरू होते हैं।','All counts start at zero.')}</p></div></div><div class="heroStat"><div class="stat"><b>${db.elections.length}</b><span>${t('चुनाव','Elections')}</span></div><div class="stat"><b>${db.candidates.length}</b><span>${t('उम्मीदवार','Candidates')}</span></div><div class="stat"><b>${db.votes.length}</b><span>${t('वोट','Votes')}</span></div><div class="stat"><b>${db.geography.units.length}</b><span>${t('स्थानीय इकाइयाँ','Local Units')}</span></div></div><div style="margin-top:14px">${promo('promo4')}</div></div></div><div class="panel" style="padding:18px;margin-bottom:18px"><div class="pageHead"><div><h3 style="margin:0">${t('तेज़ खोज','Quick Search')}</h3><p>${t('उम्मीदवार, दल, चुनाव या स्थानीय इकाई खोजें।','Search candidate, party, election or local unit.')}</p></div></div><div class="formgrid"><input class="input" id="homeSearch" placeholder="${t('नाम / दल / गाँव / चुनाव...','Name / party / village / election...')}" onkeydown="if(event.key==='Enter')quickSearch()"><button class="btn primary" onclick="quickSearch()">${t('खोजें','Search')}</button></div></div><div class="grid cards3"><div>${promo('promo5')}</div><div class="panel" style="padding:16px"><b>${t('परिणाम','Results')}</b><p style="color:var(--m);font-size:12px">${t('परिणाम पेज पर चुनाव और वार्ड के अनुसार देखें।','View by election and ward on the Results page.')}</p><button class="btn small" onclick="go('results')">${t('परिणाम खोलें','Open Results')}</button></div><div class="panel" style="padding:16px"><b>${t('विश्लेषण','Analytics')}</b><p style="color:var(--m);font-size:12px">${t('वोट प्रतिशत, टर्नआउट और तुलना।','Vote share, turnout and comparison.')}</p><button class="btn small" onclick="go('analytics')">${t('विश्लेषण खोलें','Open Analytics')}</button></div></div>`);
 if(page==='geography')return pageWrap(titleFor('geography'),t('State → District → Block/Tehsil → Local Unit → Ward','State → District → Block/Tehsil → Local Unit → Ward'),`<div class="panel" style="padding:18px"><div class="formgrid3"><div class="field"><label>${t('राज्य','State')}</label><select><option>Rajasthan</option></select></div><div class="field"><label>${t('जिला','District')}</label><select><option>JALORE</option></select></div><div class="field"><label>${t('ब्लॉक / तहसील','Block / Tehsil')}</label><select>${db.geography.blocks.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div></div><div class="panel" style="padding:14px;margin-top:14px"><b>${t('स्थानीय इकाइयाँ','Local Units')}</b><div class="grid cards6" style="margin-top:12px">${db.geography.units.map(x=>`<div class="card" style="padding:12px"><b>${esc(x)}</b><small style="display:block;color:var(--m);margin-top:4px">${db.geography.wards[x]||0} ${t('वार्ड','wards')}</small></div>`).join('')}</div></div></div>`);
 if(page==='elections')return pageWrap(titleFor('elections'),t('निर्वाचन प्रकार चुनें और नया चुनाव विवरण देखें','Choose election type and view elections'),`<div class="panel" style="padding:18px"><div class="toolbar"><select class="input" id="filterElectionType" style="max-width:360px" onchange="renderPage('elections')"><option value="">${t('सभी प्रकार','All types')}</option>${ELECTION_TYPES.map(x=>`<option ${document.getElementById('filterElectionType')?.value===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="grid cards3">${db.elections.length?db.elections.filter(e=>!document.getElementById('filterElectionType')?.value||e.type===document.getElementById('filterElectionType').value).map(e=>`<div class="card" style="padding:16px"><div class="chips"><span class="chip">${esc(e.type)}</span><span class="chip">${e.status}</span></div><h3>${esc(lang==='hi'?e.nameHi:e.nameEn)}</h3><p style="color:var(--m)">${esc(e.localUnit||'')} · ${esc(e.ward||'')}</p><button class="btn small" onclick="selectElection('${e.id}')">${t('चुनाव चुनें','Select')}</button></div>`).join(''):`<div class="empty" style="grid-column:1/-1">${t('अभी कोई चुनाव नहीं है। Admin में नया चुनाव बनाएं।','No election exists. Create one in Admin.')}</div>`}</div></div>`);
 if(page==='candidates')return pageWrap(titleFor('candidates'),t('चयनित चुनाव के उम्मीदवार','Candidates for selected election'),`<div class="panel" style="padding:18px"><div class="toolbar"><select class="input" id="publicElectionSelect" onchange="selectedElection=this.value;renderPage('candidates')"><option value="">${t('चुनाव चुनें','Select Election')}</option>${db.elections.map(e=>`<option value="${e.id}" ${selectedElection===e.id?'selected':''}>${esc(e.nameEn)}</option>`).join('')}</select><input class="input" id="candidateSearch" style="max-width:360px" placeholder="${t('उम्मीदवार / दल / वार्ड','Candidate / party / ward')}" oninput="renderCandidateCards()"></div><div id="candidateCards" class="grid cards6"></div></div>`);
 if(page==='search')return pageWrap(titleFor('search'),t('पूरे डेटाबेस में उम्मीदवार खोजें','Search the complete candidate database'),`<div class="panel" style="padding:18px"><div class="formgrid"><input class="input" id="globalSearch" placeholder="${t('नाम, दल, जिला, ULB, वार्ड...','Name, party, district, ULB, ward...')}" oninput="renderSearchResults()"><select id="globalSearchType" class="input"><option value="all">${t('सभी','All')}</option><option value="candidate">${t('उम्मीदवार','Candidate')}</option><option value="party">${t('दल','Party')}</option><option value="ward">${t('वार्ड','Ward')}</option></select></div><div id="searchResults" style="margin-top:14px"></div></div>`);
 if(page==='voting')return pageWrap(titleFor('voting'),t('चुनाव चुनें → उम्मीदवार चुनें → मतदाता सत्यापन','Select election → candidate → voter verification'),`<div class="panel" style="padding:18px"><div class="formgrid"><div class="field"><label>${t('चुनाव','Election')}</label><select id="voteElection" onchange="renderVotingCandidates()"><option value="">${t('चुनाव चुनें','Select election')}</option>${db.elections.map(e=>`<option value="${e.id}" ${selectedElection===e.id?'selected':''}>${esc(e.nameEn)}</option>`).join('')}</select></div><div class="field"><label>${t('मोबाइल नंबर','Mobile')}</label><input class="input" id="voteMobile" maxlength="10" inputmode="numeric"></div></div><div id="voteCandidates" style="margin-top:14px"></div><div class="toolbar"><button class="btn primary" onclick="submitVote()">${t('वोट जमा करें','Submit Vote')}</button></div></div>`);
 if(page==='results')return pageWrap(titleFor('results'),t('प्रकाशित परिणाम केवल सक्रिय/प्रकाशित चुनावों के लिए दिखेंगे','Published results appear for published elections'),`<div class="panel" style="padding:18px"><div id="resultsBox"></div></div>`);
 if(page==='analytics')return pageWrap(titleFor('analytics'),t('वोट शेयर और भौगोलिक विश्लेषण','Vote share and geographic analytics'),`<div id="analyticsBox" class="kpiGrid"></div><div class="panel" style="padding:18px;margin-top:14px" id="analyticsDetail"></div>`);
 if(page==='stats')return pageWrap(titleFor('stats'),t('सिस्टम आँकड़े','System statistics'),`<div id="statsBox" class="kpiGrid"></div>`);
 if(page==='notifications')return pageWrap(titleFor('notifications'),t('लाइव और प्रकाशित सूचनाएँ','Live and published notifications'),`<div class="grid cards3">${db.notifications.map(n=>`<div class="card" style="padding:16px"><div class="chips"><span class="chip">${n.live?'LIVE':'Notice'}</span></div><h3>${esc(lang==='hi'?n.hi:n.en)}</h3><small>${new Date().toLocaleString()}</small></div>`).join('')}</div>`);
 if(page==='services')return pageWrap(titleFor('services'),t('40 नागरिक सुविधाएँ','40 citizen services'),`<div class="grid serviceGrid">${BASE_FEATURES.map((x,i)=>`<div class="service"><div><div class="icon">${String(i+1).padStart(2,'0')}</div><h3>${esc(lang==='hi'?x[1]:x[2])}</h3><p>${esc(serviceDesc(x[0]))}</p></div><button class="btn small" onclick="serviceOpen('${x[0]}')">${t('खोलें','Open')}</button></div>`).join('')}</div>`);
 return pageWrap(titleFor(page),t('यह सुविधा उपलब्ध है और अपने डेटा से काम करती है।','This feature is available and works with the portal data.'),`<div class="panel" style="padding:18px"><div id="genericPublicTool"></div></div>`);
}
function serviceDesc(k){return ({dashboard:'मुख्य डैशबोर्ड',geography:'राज्य से वार्ड तक भूगोल',elections:'चुनाव सूची',candidates:'उम्मीदवार कार्ड',search:'पूरे डेटाबेस में खोज',voting:'मतदान प्रक्रिया',results:'परिणाम',analytics:'विश्लेषण',stats:'आँकड़े',notifications:'लाइव अपडेट',comparison:'दो उम्मीदवारों की तुलना',directory:'डायरेक्टरी',schedule:'तारीखें',polling:'मतदान केंद्र',reservations:'आरक्षण',parties:'दल',symbols:'चिह्न',documents:'दस्तावेज़',rules:'नियम',turnout:'मत प्रतिशत',map:'भौगोलिक अवलोकन',wardResults:'वार्ड परिणाम',unitResults:'स्थानीय इकाई परिणाम',candidateResults:'उम्मीदवार परिणाम',partyResults:'दल परिणाम',electionCompare:'चुनाव तुलना',liveBoard:'लाइव बोर्ड',download:'डाउनलोड',print:'प्रिंट',share:'शेयर',suggest:'सुझाव',feedback:'फीडबैक',help:'सहायता',access:'बड़ी स्क्रीन/कॉन्ट्रास्ट',translator:'हिंदी अनुवाद',myVote:'मेरे वोट की जाँच',official:'आधिकारिक सूचना',about:'पोर्टल जानकारी'}[k]||'Portal feature')}
function openServices(){go('services')}
function selectElection(id){selectedElection=id;go('candidates')}
function renderCandidateCards(){const root=document.getElementById('candidateCards');if(!root)return;const q=(document.getElementById('candidateSearch')?.value||'').trim().toLowerCase();let rows=db.candidates.filter(c=>!selectedElection||c.electionId===selectedElection);rows=rows.filter(c=>!q||[c.nameHi,c.nameEn,c.party,c.ward,c.ulb,c.unit,c.symbol].join(' ').toLowerCase().includes(q));root.innerHTML=rows.length?rows.map(c=>`<article class="candidate card ${selectedCandidate===c.id?'selected':''}"><div class="candidateTop"></div><div class="candidateBody"><div class="candPhoto">${c.photo?`<img src="${esc(c.photo)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`:'👤'}</div><div class="candName">${esc(c.nameHi)}</div><div class="candEn">${esc(c.nameEn)}</div><div class="candMeta"><div class="mini">${t('दल','Party')}<b>${esc(c.party||'Independent')}</b></div><div class="mini">${t('वार्ड','Ward')}<b>${esc(c.ward)}</b></div><div class="mini">${t('श्रेणी','Category')}<b>${esc(c.category)}</b></div><div class="mini">${t('आयु/लिंग','Age/Gender')}<b>${esc(c.age)} / ${esc(c.gender)}</b></div><div class="mini" style="grid-column:1/-1">${t('चिह्न','Symbol')}<b>${esc(c.symbol)}</b></div></div></div><div class="candActions"><button class="btn small" onclick="showCandidate('${c.id}')">${t('विवरण','Details')}</button><button class="btn small primary" onclick="pickCandidate('${c.id}')">${t('चुनें','Select')}</button></div></article>`).join(''):`<div class="empty" style="grid-column:1/-1">${t('इस चुनाव में अभी कोई उम्मीदवार नहीं है। Admin में जोड़ें या Bulk Import करें।','No candidates in this election yet. Add or Bulk Import from Admin.')}</div>`}
function pickCandidate(id){selectedCandidate=id;toast(t('उम्मीदवार चुना गया। अब मतदान पेज खोलें।','Candidate selected. Open Voting to continue.'));go('voting')}
function showCandidate(id){const c=db.candidates.find(x=>x.id===id);if(!c)return;openModal(t('उम्मीदवार विवरण','Candidate Details'),`<div class="formgrid"><div><b>${esc(c.nameHi)}</b><p>${esc(c.nameEn)}</p></div><div><b>${esc(c.party)}</b><p>${esc(c.symbol)}</p></div><div><b>${t('जिला','District')}</b><p>${esc(c.district)}</p></div><div><b>${t('ULB','ULB')}</b><p>${esc(c.ulb)}</p></div><div><b>${t('वार्ड','Ward')}</b><p>${esc(c.ward)} · ${esc(c.reservation)}</p></div><div><b>${t('श्रेणी','Category')}</b><p>${esc(c.category)}</p></div></div>`)}
function renderSearchResults(){const out=document.getElementById('searchResults');if(!out)return;const q=(document.getElementById('globalSearch')?.value||'').toLowerCase().trim();let rows=db.candidates.filter(c=>!q||Object.values(c).join(' ').toLowerCase().includes(q));out.innerHTML=rows.length?`<div class="tableWrap"><table class="table"><thead><tr><th>Candidate</th><th>Election</th><th>District</th><th>ULB</th><th>Ward</th><th>Party</th><th>Actions</th></tr></thead><tbody>${rows.map(c=>`<tr><td>${esc(c.nameHi)} / ${esc(c.nameEn)}</td><td>${esc(db.elections.find(e=>e.id===c.electionId)?.nameEn||'')}</td><td>${esc(c.district)}</td><td>${esc(c.ulb)}</td><td>${esc(c.ward)}</td><td>${esc(c.party)}</td><td><button class="btn small" onclick="showCandidate('${c.id}')">${t('देखें','View')}</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${t('कोई परिणाम नहीं।','No results.')}</div>`}
function renderVotingCandidates(){const box=document.getElementById('voteCandidates');if(!box)return;selectedElection=document.getElementById('voteElection').value;const rows=db.candidates.filter(c=>c.electionId===selectedElection);box.innerHTML=rows.length?`<div class="grid cards6">${rows.map(c=>`<button class="candidate card ${selectedCandidate===c.id?'selected':''}" onclick="pickCandidate('${c.id}')" style="text-align:left"><div class="candidateTop"></div><div class="candidateBody"><div class="candPhoto">👤</div><div class="candName">${esc(c.nameHi)}</div><div class="candEn">${esc(c.nameEn)}</div><div class="candMeta"><div class="mini">${t('दल','Party')}<b>${esc(c.party)}</b></div><div class="mini">${t('वार्ड','Ward')}<b>${esc(c.ward)}</b></div></div></div></button>`).join('')}</div>`:`<div class="empty">${t('अभी कोई उम्मीदवार नहीं।','No candidates yet.')}</div>`}
function submitVote(){if(db.settings.emergency||db.settings.maintenance||!db.settings.votingOpen)return toast(t('मतदान अभी बंद है।','Voting is currently closed.'),true);const mob=(document.getElementById('voteMobile')?.value||'').replace(/\D/g,'');if(!/^\d{10}$/.test(mob))return toast(t('10 अंकों का मोबाइल नंबर डालें।','Enter a 10-digit mobile number.'),true);if(!selectedElection||!selectedCandidate)return toast(t('चुनाव और उम्मीदवार चुनें।','Select election and candidate.'),true);if(db.votes.some(v=>v.electionId===selectedElection&&v.mobileHash===btoa(mob)))return toast(t('इस मोबाइल से पहले ही वोट हो चुका है।','This mobile has already voted.'),true);const c=db.candidates.find(x=>x.id===selectedCandidate&&x.electionId===selectedElection);if(!c)return toast(t('उम्मीदवार नहीं मिला।','Candidate not found.'),true);db.votes.push({id:id('V'),electionId:selectedElection,candidateId:c.id,mobileHash:btoa(mob),time:new Date().toISOString(),status:'valid'});save();toast(t('वोट सफलतापूर्वक दर्ज हुआ।','Vote recorded successfully.'));go('results')}
function renderResults(){const box=document.getElementById('resultsBox');if(!box)return;const pubs=db.elections.filter(e=>e.published||db.settings.resultsPublished);if(!pubs.length)return box.innerHTML='<div class="empty">'+t('अभी प्रकाशित परिणाम नहीं हैं।','No published results yet.')+'</div>';box.innerHTML=pubs.map(e=>{const rows=db.candidates.filter(c=>c.electionId===e.id).map(c=>({c,n:db.votes.filter(v=>v.electionId===e.id&&v.candidateId===c.id).length})).sort((a,b)=>b.n-a.n);const total=rows.reduce((s,x)=>s+x.n,0);return `<div style="margin-bottom:20px"><div class="pageHead"><div><h3 style="margin:0">${esc(e.nameHi)}</h3><p>${esc(e.nameEn)} · ${esc(e.type)}</p></div><span class="chip">${total} votes</span></div>${rows.length?rows.map(r=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><b>${esc(r.c.nameHi)}</b><span>${r.n} · ${total?(r.n/total*100).toFixed(1):'0'}%</span></div><div class="bar"><i style="width:${total?Math.min(100,r.n/total*100):0}%"></i></div></div>`).join(''):'<div class="empty">No candidates</div>'}</div>`}).join('')}

function translateText(src){const s=String(src||'').trim();if(!s)return '';let r=s;Object.keys(HI).sort((a,b)=>b.length-a.length).forEach(k=>{r=r.replace(new RegExp('\\b'+k.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'\\b','gi'),HI[k])});const map={'Ward':'वार्ड','Name':'नाम','District':'जिला','Village':'गाँव','Block':'ब्लॉक','Party':'दल','Candidate':'उम्मीदवार','Age':'आयु','Gender':'लिंग','General':'सामान्य','Woman':'महिला','Male':'पुरुष','Female':'महिला','Independent':'निर्दलीय','Council':'परिषद','Municipality':'नगर पालिका','Election':'चुनाव','Polling':'मतदान','Station':'केंद्र'};Object.entries(map).forEach(([a,b])=>{r=r.replace(new RegExp('\\b'+a+'\\b','gi'),b)});if(r===s){r=s.split(/\s+/).map(w=>w.length<=2?w:w[0]+w.slice(1)).join(' ')}return r}

function parseSecPaste(text){const lines=String(text||'').replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);const table=lines.filter(l=>l.includes('|')).map(l=>l.replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim()));let headerIndex=table.findIndex(r=>r.some(c=>/district\s*name/i.test(c)&&/ward/i.test(c)&&/candidate\s*category/i.test(c)));if(headerIndex<0)headerIndex=table.findIndex(r=>r.some(c=>/^name$/i.test(c))&&r.some(c=>/ward/i.test(c)));if(headerIndex<0)throw new Error('Header row not found. Copy the full SEC table including the header.');const H=table[headerIndex].map(normalizeHeader);const idx={district:H.findIndex(x=>x==='district'),ulb:H.findIndex(x=>x==='ulb'),ward:H.findIndex(x=>x==='ward'),reservation:H.findIndex(x=>x==='reservation'),name:H.findIndex(x=>x==='name'),gender:H.findIndex(x=>x==='gender'),age:H.findIndex(x=>x==='age'),category:H.findIndex(x=>x==='category'),party:H.findIndex(x=>x==='party')};['district','ulb','ward','name','gender','age','category','party'].forEach(k=>{if(idx[k]<0)throw new Error('Missing required column: '+k)});const out=[];for(let i=headerIndex+1;i<table.length;i++){const r=table[i];if(!r.length)continue;if(r.every(c=>!c||/^:-+$|^-+$/.test(c)))continue;if(r.some(c=>/^sr\s*no|district\s*name|ulb\s*name/i.test(c)))continue;const c={district:r[idx.district]||'',ulb:r[idx.ulb]||'',ward:r[idx.ward]||'',reservation:idx.reservation>=0?r[idx.reservation]||'':'',nameHi:r[idx.name]||'',nameEn:translateBack(r[idx.name]||''),gender:r[idx.gender]||'',age:r[idx.age]||'',category:r[idx.category]||'',party:r[idx.party]||'Independent',symbol:'Not assigned',photo:''};if(!c.nameHi)continue;out.push(c)}return out}
function normalizeHeader(s){let x=s.toLowerCase().replace(/\*/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();if(/district/.test(x))return 'district';if(/ulb/.test(x)||/municipality|local body/.test(x))return 'ulb';if(/ward no|ward number|ward$/.test(x))return 'ward';if(/reservation/.test(x))return 'reservation';if(/^name$/.test(x)||/candidate name/.test(x))return 'name';if(/gender|sex/.test(x))return 'gender';if(/^age$/.test(x))return 'age';if(/candidate category|category/.test(x))return 'category';if(/party name|party$/.test(x))return 'party';return x}
function translateBack(x){
 const s=String(x||'').trim(); if(!/[\u0900-\u097F]/.test(s)) return s;
 const M={'अ':'a','आ':'aa','इ':'i','ई':'ee','उ':'u','ऊ':'oo','ए':'e','ऐ':'ai','ओ':'o','औ':'au','ऋ':'ri','क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'n','च':'ch','छ':'chh','ज':'j','झ':'jh','ञ':'n','ट':'t','ठ':'th','ड':'d','ढ':'dh','ण':'n','त':'t','थ':'th','द':'d','ध':'dh','न':'n','प':'p','फ':'ph','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','व':'v','श':'sh','ष':'sh','स':'s','ह':'h','ड़':'r','ढ़':'rh','क्ष':'ksh','त्र':'tr','ज्ञ':'gy','ा':'aa','ि':'i','ी':'ee','ु':'u','ू':'oo','े':'e','ै':'ai','ो':'o','ौ':'au','ं':'n','ः':'h','ँ':'n','्':''};
 return s.split(/\s+/).map(w=>{let o='';for(const ch of w)o+=M[ch]??ch;return o.charAt(0).toUpperCase()+o.slice(1)}).join(' ');
}

function saveWardCount(){const u=document.getElementById('wardUnit').value;db.geography.wards[u]=Math.max(0,Number(document.getElementById('wardCount').value||0));save();toast('Ward count saved')}
function saveReservation(){const u=document.getElementById('resUnit').value;db.reservations=db.reservations||{};db.reservations[u]=document.getElementById('resValue').value;save();toast('Reservation saved')}
function savePollingStation(){db.pollingStations=db.pollingStations||[];db.pollingStations.push({id:id('PS'),name:document.getElementById('psName').value,unit:document.getElementById('psUnit').value,ward:document.getElementById('psWard').value,address:document.getElementById('psAddress').value});save();toast('Polling station added');openAdminTool('pollingStation')}
function saveParty(){db.parties=db.parties||[];db.parties.push({en:document.getElementById('partyName').value,hi:document.getElementById('partyNameHi').value||translateText(document.getElementById('partyName').value)});save();openAdminTool('partyManage')}
function defaultPhotoData(){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="100%" height="100%" rx="80" fill="#eff7f1"/><circle cx="256" cy="190" r="90" fill="#0b2945"/><path d="M90 440c20-110 90-160 166-160s146 50 166 160" fill="#0b2945"/><circle cx="256" cy="190" r="52" fill="#fff"/></svg>')}
function setDefaultPhoto(){const c=db.candidates.find(x=>x.id===document.getElementById('photoCandidate').value);if(c){c.photo=defaultPhotoData();save();toast('Default photo saved')}}
function saveCandidatePhoto(){const c=db.candidates.find(x=>x.id===document.getElementById('photoCandidate').value);if(!c)return;const f=document.getElementById('photoFile').files?.[0];if(f){const r=new FileReader();r.onload=()=>{c.photo=r.result;save();toast('Photo uploaded')};r.readAsDataURL(f)}else{c.photo=document.getElementById('photoUrl').value;save();toast('Photo saved')}}
function symbolData(name){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="100%" height="100%" rx="30" fill="#fff7ed"/><circle cx="150" cy="135" r="72" fill="#138a3d" opacity=".12"/><text x="150" y="150" text-anchor="middle" font-size="70">◉</text><text x="150" y="235" text-anchor="middle" font-family="Arial" font-size="22" fill="#08243d">${name}</text></svg>`)}
function saveCandidateSymbol(){const c=db.candidates.find(x=>x.id===document.getElementById('symbolCandidate').value);if(!c)return;c.symbol=document.getElementById('symbolName').value;c.symbolImage=symbolData(c.symbol);save();toast('Symbol assigned')}
function saveNomination(){db.nominations=db.nominations||[];db.nominations.push({id:id('NM'),candidateId:document.getElementById('nomCandidate').value,status:document.getElementById('nomStatus').value,time:new Date().toISOString()});save();toast('Nomination saved')}
function saveDocument(){db.documents=db.documents||[];db.documents.push({id:id('D'),title:document.getElementById('docTitle').value,url:document.getElementById('docUrl').value});save();toast('Document saved');openAdminTool('documentManage')}
function resetElectionVotes(){const e=document.getElementById('resetElection').value;if(!e)return;db.votes=db.votes.filter(v=>v.electionId!==e);save();toast('Votes reset for selected election')}
function saveTurnout(){db.turnout=db.turnout||{};db.turnout[document.getElementById('turnoutElection').value]=document.getElementById('turnoutValue').value;save();toast('Turnout saved')}
function repairDB(){db.settings=db.settings||{};db.elections=Array.isArray(db.elections)?db.elections:[];db.candidates=Array.isArray(db.candidates)?db.candidates:[];db.votes=Array.isArray(db.votes)?db.votes:[];db.notifications=Array.isArray(db.notifications)?db.notifications:[];db.audit=Array.isArray(db.audit)?db.audit:[];db.geography=db.geography||{};db.geography.units=Array.isArray(db.geography.units)?db.geography.units:[];save();toast('Database repaired')}
function loadElectionEdit(){const e=db.elections.find(x=>x.id===document.getElementById('editElection').value);if(!e)return;document.getElementById('eeNameEn').value=e.nameEn;document.getElementById('eeNameHi').value=e.nameHi;document.getElementById('eeStatus').value=e.status||'Draft';document.getElementById('eePublish').checked=!!e.published}
function saveElectionEdit(){const e=db.elections.find(x=>x.id===document.getElementById('editElection').value);if(!e)return;e.nameEn=document.getElementById('eeNameEn').value;e.nameHi=document.getElementById('eeNameHi').value||translateText(e.nameEn);e.status=document.getElementById('eeStatus').value;e.published=document.getElementById('eePublish').checked;save();toast('Election updated')}
function downloadVoteCSV(){const rows=[['Vote ID','Election','Candidate','Time','Status']];db.votes.forEach(v=>rows.push([v.id,v.electionId,db.candidates.find(c=>c.id===v.candidateId)?.nameEn||'',v.time,v.status]));downloadTextCSV(rows,'votes.csv')}
function downloadElectionCSV(){const rows=[['ID','Type','Name Hindi','Name English','Unit','Status','Published']];db.elections.forEach(e=>rows.push([e.id,e.type,e.nameHi,e.nameEn,e.localUnit,e.status,e.published]));downloadTextCSV(rows,'elections.csv')}
function downloadTextCSV(rows,name){const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click()}
function recordAdminAction(key){db.audit.push({id:id('A'),action:key,time:new Date().toISOString()});save();toast('Action saved: '+key)}
function adminPromo(key){const idx=Number(key.replace('promo',''))-1;const p=db.promotions[idx];return panel(`Promotion Source ${idx+1}`,`<div class="adminGrid"><input class="adminInput" id="prEn" value="${esc(p.titleEn)}" data-auto-hi-target="prHi" placeholder="English title"><input class="adminInput" id="prHi" value="${esc(p.titleHi)}" placeholder="Hindi title"><input class="adminInput" id="prUrl" value="${esc(p.url)}" placeholder="URL"><textarea class="adminInput" id="prBodyEn" data-auto-hi-target="prBodyHi" rows="5">${esc(p.bodyEn)}</textarea><textarea class="adminInput" id="prBodyHi" rows="5">${esc(p.bodyHi)}</textarea></div><label style="display:block;margin-top:10px"><input type="checkbox" id="prEnabled" ${p.enabled?'checked':''}> Enable public promotion</label><button class="btn primary" style="margin-top:12px" onclick="savePromo(${idx})">Save Promotion</button>`)}
function savePromo(i){const p=db.promotions[i];Object.assign(p,{titleEn:document.getElementById('prEn').value,titleHi:document.getElementById('prHi').value||translateText(document.getElementById('prEn').value),url:document.getElementById('prUrl').value,bodyEn:document.getElementById('prBodyEn').value,bodyHi:document.getElementById('prBodyHi').value||translateText(document.getElementById('prBodyEn').value),enabled:document.getElementById('prEnabled').checked});save();toast('Promotion saved')}
function renderInitial(){renderNav();renderPage('dashboard');setInterval(()=>document.getElementById('liveClock').textContent=new Date().toLocaleString(),1000);}
document.addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal()});
renderInitial();
</script>
</body>
</html>
